name: Feature request / 改善提案
description: Propose a deterministic, testable parser, dictionary, MCP, or validation improvement.
title: "[Proposal] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        決定論的に定義・再現・検証できる改善を提案してください。
        Propose an improvement that can be defined, reproduced, and validated deterministically.
  - type: dropdown
    id: area
    attributes:
      label: Area / 対象領域
      options:
        - Grammar / Meaning Graph
        - Scope / Reference / Contradiction
        - Task Graph / External Action Guard
        - Rule / Metaphor / Synonym
        - Workflow / Gold Corpus
        - Open Dictionary Supply Chain
        - MCP integration
        - Accuracy / Performance / Offline validation
        - Documentation / Public usability
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / 解決したい問題
      description: Describe the unsupported, incorrect, unsafe, or difficult behavior.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Concrete examples / 具体例
      description: Include positive, negative, ambiguous, and collision cases when applicable.
      render: text
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed deterministic behavior / 提案する決定論的挙動
      description: Explain the expected Meaning Graph, Task Graph, dictionary mapping, or validation rule.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source and evidence / Source・根拠
      description: Add public sources, license information, or reproducible measurements where relevant.
  - type: textarea
    id: tests
    attributes:
      label: Required tests / 必要なTest
      description: Describe the Gold, regression, collision, safety, offline, or performance cases needed.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation / 確認
      options:
        - label: The proposal does not require runtime LLM or external AI calls. / RuntimeでLLMや外部AIを呼ぶ提案ではありません。
          required: true
        - label: The proposal does not include copied proprietary dictionary definitions or corpus sentences. / Proprietary辞書定義やCorpus文の転載を含みません。
          required: true
        - label: I removed secrets, personal data, and private workspace links. / 秘密情報・個人情報・非公開Workspace Linkを除外しました。
          required: true
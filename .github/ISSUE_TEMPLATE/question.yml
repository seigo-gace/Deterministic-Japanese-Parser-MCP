name: Usage question / 利用方法の質問
description: Ask about installation, MCP configuration, Python API, dictionaries, or validation.
title: "[Question] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Public Repositoryの利用方法に関する質問用です。秘密情報、個人情報、非公開URLは記載しないでください。
        Use this form for public usage questions. Do not include secrets, personal data, or private URLs.
  - type: dropdown
    id: topic
    attributes:
      label: Topic / 質問領域
      options:
        - Installation
        - MCP client configuration
        - Python API
        - Meaning Graph / Task Graph output
        - Dictionary contribution
        - Validation commands
        - Offline package
        - Performance contract
        - Licensing / attribution
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit SHA / VersionまたはCommit SHA
      placeholder: "0.3.1 or main"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal / 実現したいこと
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you tried / 試した内容
      description: Include commands and sanitized output when useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 実行環境
      placeholder: "OS, Python version, installation method, MCP client"
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation / 確認
      options:
        - label: I checked README, docs/README.md, and SUPPORT.md. / README、docs/README.md、SUPPORT.mdを確認しました。
          required: true
        - label: I removed secrets, credentials, personal data, and private URLs. / 秘密情報・認証情報・個人情報・非公開URLを除外しました。
          required: true
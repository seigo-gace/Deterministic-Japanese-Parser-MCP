name: Release Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare build tools
        run: python -m pip install --upgrade pip build

      - name: Fetch official JMdict and build the 100k+ lexical base
        run: |
          set -euo pipefail
          mkdir -p downloads work reports dictionaries/sources
          python tools/fetch_open_dictionary.py \
            --source jmdict \
            --output downloads/JMdict_e.gz \
            --manifest reports/open-lexicon-source.json
          SOURCE_SHA=$(python -c 'import json; print(json.load(open("reports/open-lexicon-source.json", encoding="utf-8"))["sha256"])')
          SOURCE_VERSION="sha256-${SOURCE_SHA:0:12}"
          BATCH_ID="release-jmdict-${GITHUB_SHA:0:12}"
          echo "OPEN_LEXICON_BATCH_ID=${BATCH_ID}" >> "$GITHUB_ENV"
          echo "OPEN_LEXICON_SOURCE_VERSION=${SOURCE_VERSION}" >> "$GITHUB_ENV"
          python tools/dictionary_supply/importers/jmdict.py \
            --input downloads/JMdict_e.gz \
            --source-version "$SOURCE_VERSION" \
            --lexical-only \
            --output work/jmdict-lexical.jsonl
          python tools/build_open_lexicon.py \
            --input work/jmdict-lexical.jsonl \
            --output-root dictionaries/system/lexicon.d \
            --manifest "dictionaries/sources/${BATCH_ID}.json" \
            --batch-id "$BATCH_ID" \
            --minimum-records 100000 \
            --maximum-records 120000 \
            --shard-size 10000 \
            --repo-root . \
            --sync-repository-metadata \
            | tee reports/open-lexicon-build.txt
          cp "dictionaries/sources/${BATCH_ID}.json" reports/open-lexicon-manifest.json
          DJPMCP_MIN_LEXICON_RECORDS=100000 \
            python tools/lexicon_validator.py \
            | tee reports/open-lexicon-validator.txt
          python - <<'PY'
          import json
          manifest = json.load(open("reports/open-lexicon-manifest.json", encoding="utf-8"))
          assert manifest["record_count"] >= 100000, manifest
          assert manifest["minimum_record_contract"] == 100000, manifest
          assert manifest["reading_alias_promotion"] is False, manifest
          assert manifest["semantic_auto_promotion"] is False, manifest
          assert manifest["external_action_auto_promotion"] is False, manifest
          assert all(item["compressed_sha256"] for item in manifest["shards"]), manifest
          print({
              "open_lexicon_records": manifest["record_count"],
              "open_lexicon_surfaces": manifest["surface_count"],
              "open_lexicon_shards": len(manifest["shards"]),
              "compressed_bytes": manifest["compressed_bytes"],
          })
          PY
          du -sh downloads work dictionaries/system/lexicon.d | tee reports/open-lexicon-disk-usage.txt

      - name: Audit all built JMdict records and lexical lookup accuracy
        run: |
          set -o pipefail
          python tools/open_lexicon_accuracy.py \
            --source downloads/JMdict_e.gz \
            --lexicon-root dictionaries/system/lexicon.d \
            --manifest reports/open-lexicon-manifest.json \
            --minimum-records 100000 \
            --containment-cases 20000 \
            --pollution-cases 20000 \
            --output reports/open-lexicon-accuracy.json \
            | tee reports/open-lexicon-accuracy.txt

      - name: Download and build every dependency after lexicon generation
        run: |
          mkdir -p wheelhouse dist reports
          python -m pip wheel ".[dev]" --wheel-dir wheelhouse
          python -m build --wheel --outdir dist
          python -m pip freeze | sort > reports/build-environment.txt

      - name: Create immutable release manifest
        run: |
          python scripts/write_release_manifest.py \
            --root . \
            --include wheelhouse \
            --include dist \
            --include dictionaries/system/lexicon.d \
            --include dictionaries/sources \
            --output reports/release-manifest.json

      - name: Create clean offline environment
        run: python -m venv .offline-venv

      - name: Install only from prepared wheelhouse
        env:
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          . .offline-venv/bin/activate
          python -m pip install --no-index --find-links wheelhouse dist/*.whl
          python -m pip install --no-index --find-links wheelhouse pytest pytest-cov
          python -m pip freeze | sort > reports/offline-installed-environment.txt

      - name: Verify installed wheel and 100k+ lexicon outside repository
        env:
          PIP_NO_INDEX: "1"
        run: |
          . .offline-venv/bin/activate
          cd /tmp
          python -I - <<'PY'
          from deterministic_japanese_parser_mcp import AnalyzeRequest, ParserEngine

          engine = ParserEngine()
          lexicon_count = engine.bundle.lexicon["record_count"]
          assert lexicon_count >= 100000, lexicon_count
          assert engine.bundle.lexicon["exact_only_group_count"] >= 100000
          response = engine.analyze(AnalyzeRequest(
              original_text="UIは維持する。APIだけ変更しろ。",
              execution_mode="external_action",
              deadline_ms=50,
          ))
          assert engine.tokenizer.backend == "sudachi-core"
          assert {"preserve", "modify"} <= {item.type for item in response.intents}
          assert response.meaning_graph.propositions
          assert response.meaning_graph.semantic_hash
          assert [task.intent_type for task in response.task_graph.tasks] == ["modify"]
          assert response.original_text == "UIは維持する。APIだけ変更しろ。"
          print({
              "installed_wheel": "OK",
              "tokenizer": engine.tokenizer.backend,
              "rules": len(engine.rules.compiled),
              "metaphors": len(engine.metaphors.entries),
              "open_lexicon_records": lexicon_count,
              "exact_only_groups": engine.bundle.lexicon["exact_only_group_count"],
              "canonical_groups": len(engine.bundle.synonyms["groups"]),
              "propositions": len(response.meaning_graph.propositions),
              "action_tasks": len(response.task_graph.tasks),
          })
          PY

      - name: Offline deployment preflight
        env:
          PIP_NO_INDEX: "1"
        run: |
          set -o pipefail
          . .offline-venv/bin/activate
          python scripts/preflight.py | tee reports/offline-preflight.json

      - name: Offline runtime lexicon provenance and 100k minimum validation
        env:
          PIP_NO_INDEX: "1"
          DJPMCP_MIN_LEXICON_RECORDS: "100000"
        run: |
          set -o pipefail
          . .offline-venv/bin/activate
          python tools/lexicon_validator.py | tee reports/offline-lexicon-validator.txt

      - name: Offline dictionary and Gold validation
        env:
          PIP_NO_INDEX: "1"
        run: |
          set -o pipefail
          . .offline-venv/bin/activate
          python tools/validator.py | tee reports/offline-validator.txt

      - name: Offline unit, importer, supply-chain and MCP stdio E2E tests
        env:
          PIP_NO_INDEX: "1"
          DJPMCP_MIN_LEXICON_RECORDS: "100000"
        run: |
          . .offline-venv/bin/activate
          pytest --junitxml=reports/offline-pytest.xml

      - name: Offline existing benchmark gate with the 100k lexical base
        env:
          PIP_NO_INDEX: "1"
        run: |
          set -o pipefail
          . .offline-venv/bin/activate
          python scripts/benchmark.py --check --rounds 100 | tee reports/offline-benchmark.json

      - name: Offline 10ms target and 20x dictionary contract with the 100k lexical base
        env:
          PIP_NO_INDEX: "1"
        run: |
          . .offline-venv/bin/activate
          python scripts/performance_contract.py --check --rounds 100 --stdio-rounds 50 --scale 20 --max-ready-ms 10 --output reports/offline-performance.json

      - name: Offline Astera 10ms target and 50ms hard contract with the 100k lexical base
        env:
          PIP_NO_INDEX: "1"
        run: |
          . .offline-venv/bin/activate
          python scripts/astera_latency_contract.py --check --rounds 100 --stdio-rounds 50 --target-ms 10 --hard-ms 50 --output reports/offline-astera-latency.json

      - name: Compile all shipped Python sources
        env:
          PIP_NO_INDEX: "1"
        run: |
          . .offline-venv/bin/activate
          python -m compileall -q src tools scripts tests

      - name: Hash all release evidence
        if: always()
        run: |
          python scripts/write_release_manifest.py \
            --root . \
            --include wheelhouse \
            --include dist \
            --include reports \
            --include dictionaries/system/lexicon.d \
            --include dictionaries/sources \
            --output evidence-manifest.json

      - name: Upload complete offline release bundle and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-japanese-parser-offline-release
          path: |
            wheelhouse
            dist
            reports
            evidence-manifest.json
          if-no-files-found: error
          retention-days: 30

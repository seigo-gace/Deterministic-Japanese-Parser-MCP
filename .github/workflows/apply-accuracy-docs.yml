name: Apply Accuracy Documentation

on:
  push:
    branches:
      - agent/open-lexicon-accuracy-validation
    paths:
      - .github/workflows/apply-accuracy-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/open-lexicon-accuracy-validation
      - name: Patch README and operational documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          ja_marker = "設計・Review・License・Rollback契約：[`docs/OPEN_DICTIONARY_SUPPLY_CHAIN.md`](docs/OPEN_DICTIONARY_SUPPLY_CHAIN.md)"
          ja_section = '''

### 12万語Open Lexiconの正確性検証

旧Snapshotを実データで再検証した結果、読みをCanonical別名へ混ぜたことと、日本語の任意部分文字列を検索したことにより、通常文から無関係な語彙候補が発生する問題を確認しました。旧Snapshotでは`UIは維持する。APIだけ変更しろ。`だけで73件の無関係候補が発生していました。

現在は次へ修正しています。

- JMdictの1 Entryを1 Source Recordとして保持
- 表記と読みを分離し、`re_restr`／`re_nokanji`を保存
- 読みをCanonical Aliasへ自動昇格しない
- Open Lexiconを完全一致専用とし、文中部分一致検索から分離
- 意味・用法をReviewしたProject独自Synonymだけを文中検索

公式JMdictからBuildした120,000 Recordを全件照合し、次を確認しました。

| Accuracy Gate | 結果 |
|---|---:|
| Source Fidelity | **120,000 / 120,000** |
| Exact Surface Lookup | **154,918 / 154,918** |
| 同形異義Surface | **962件、全候補保持** |
| 包含語Precision | **20,000 / 20,000** |
| 文中部分一致汚染 | **20,000 / 20,000、誤一致0** |
| Accuracy Error | **0** |

詳細：[`docs/OPEN_LEXICON_ACCURACY.md`](docs/OPEN_LEXICON_ACCURACY.md)
'''
          if "### 12万語Open Lexiconの正確性検証" not in readme:
              if ja_marker not in readme:
                  raise SystemExit("Japanese README insertion marker not found")
              readme = readme.replace(ja_marker, ja_marker + ja_section, 1)

          old_loader = "Loaderは正本File、Fragment、承認済みLexicon Packを決定論的に読み込みます。Open Lexiconの承認済みSurface／SynonymはCanonicalizerへ統合されます。一つのSurfaceが複数Canonicalを持つ場合は衝突を隠さず候補集合として保持します。"
          new_loader = "Loaderは正本File、Fragment、承認済みLexicon Packを決定論的に読み込みます。Open Lexiconの表記は完全一致専用として統合し、読みを別名へ昇格せず、通常文の部分文字列検索へ混ぜません。意味・用法をReviewしたProject独自Synonymだけを文中検索します。一つの完全一致Surfaceが複数Canonicalを持つ場合は衝突を隠さず候補集合として保持します。"
          if old_loader in readme:
              readme = readme.replace(old_loader, new_loader, 1)

          en_marker = "Architecture and review contract: [`docs/OPEN_DICTIONARY_SUPPLY_CHAIN.md`](docs/OPEN_DICTIONARY_SUPPLY_CHAIN.md)"
          en_section = '''

### Verified accuracy of the 120k open lexicon

A full-data audit found that the previous snapshot mixed readings into canonical aliases and scanned arbitrary Japanese substrings. As a concrete failure, `UIは維持する。APIだけ変更しろ。` produced 73 unrelated lexical candidates.

The corrected design keeps one source-traceable record per JMdict entry, preserves reading restrictions, never promotes readings as orthographic aliases, and isolates open lexical identities from phrase substring scans. Only project-authored, meaning-reviewed synonym groups remain eligible for phrase scanning.

The release gate independently compared the official JMdict dump with the generated runtime pack:

| Accuracy gate | Result |
|---|---:|
| Source fidelity | **120,000 / 120,000** |
| Exact surface lookup | **154,918 / 154,918** |
| Ambiguous exact surfaces | **962, all candidates retained** |
| Containment precision | **20,000 / 20,000** |
| Sentence substring pollution | **0 errors in 20,000 cases** |
| Accuracy errors | **0** |

Details: [`docs/OPEN_LEXICON_ACCURACY.md`](docs/OPEN_LEXICON_ACCURACY.md)
'''
          if "### Verified accuracy of the 120k open lexicon" not in readme:
              if en_marker not in readme:
                  raise SystemExit("English README insertion marker not found")
              readme = readme.replace(en_marker, en_marker + en_section, 1)
          readme_path.write_text(readme, encoding="utf-8")

          supply_path = Path("docs/OPEN_DICTIONARY_SUPPLY_CHAIN.md")
          supply = supply_path.read_text(encoding="utf-8")
          supply_section = '''

## 10. Open Lexicon Accuracy Contract

Release Readinessは件数・読込・速度だけではなく、公式Sourceと加工後Packの全件一致を検証する。

- JMdict 1 Entry = 1 Source-traceable Record
- `keb`は表記、`reb`は読みMetadata
- `re_restr`／`re_nokanji`を保持
- 読みをCanonical Aliasへ自動昇格しない
- Open Lexiconは完全一致専用
- Project独自のReview済みSynonymだけを文中検索
- 全RecordのLemma／Surface／Reading／Reading Restriction／POS／Domain／Usage Label／SHA-256を照合
- 全Surface Exact Recall
- 同形異義候補保持
- 20,000包含語Precision
- 20,000文中部分一致汚染Test

検証済み結果は[`OPEN_LEXICON_ACCURACY.md`](OPEN_LEXICON_ACCURACY.md)を正本とする。Accuracy Gate、既存回帰、Offline Wheel、性能契約の一つでも失敗したReleaseは成立しない。
'''
          if "## 10. Open Lexicon Accuracy Contract" not in supply:
              supply_path.write_text(supply.rstrip() + supply_section + "\n", encoding="utf-8")

          tools_path = Path("tools/README.md")
          tools = tools_path.read_text(encoding="utf-8")
          command = '''

### 実Open Lexicon正確性監査

```bash
python tools/open_lexicon_accuracy.py \\
  --source downloads/JMdict_e.gz \\
  --lexicon-root dictionaries/system/lexicon.d \\
  --manifest reports/open-lexicon-manifest.json \\
  --minimum-records 100000 \\
  --containment-cases 20000 \\
  --pollution-cases 20000 \\
  --output reports/open-lexicon-accuracy.json
```

全RecordのSource Fidelity、全Surfaceの完全一致、同形異義候補、包含語Precision、文中部分一致汚染を検証する。
'''
          if "### 実Open Lexicon正確性監査" not in tools:
              tools_path.write_text(tools.rstrip() + command + "\n", encoding="utf-8")
          PY
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/OPEN_DICTIONARY_SUPPLY_CHAIN.md tools/README.md
          git commit -m "docs: publish verified open lexicon accuracy results"
          git push origin HEAD:agent/open-lexicon-accuracy-validation

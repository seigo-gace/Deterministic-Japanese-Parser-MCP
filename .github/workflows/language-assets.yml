name: Compile Language Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dictionaries/system/language_features.d/**"
      - "dictionaries/system/compiled/language_features.d/**"
      - "tools/compile_language_features.py"
      - "src/deterministic_japanese_parser_mcp/literal_index.py"
      - "tests/test_compiled_language_assets.py"
      - "tests/test_workflow_safety_contract.py"
      - ".github/workflows/language-assets.yml"
  pull_request:
    paths:
      - "dictionaries/system/language_features.d/**"
      - "dictionaries/system/compiled/language_features.d/**"
      - "tools/compile_language_features.py"
      - "src/deterministic_japanese_parser_mcp/literal_index.py"
      - "tests/test_compiled_language_assets.py"
      - "tests/test_workflow_safety_contract.py"
      - ".github/workflows/language-assets.yml"

permissions:
  contents: read

concurrency:
  group: language-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-compiled-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build-only parser dependency
        run: python -m pip install "PyYAML>=6.0.3,<7" "pytest>=8.3,<10"

      - name: Rebuild language assets in a temporary directory
        run: |
          rm -rf work/language-features-compiled
          python tools/compile_language_features.py \
            --output-dir work/language-features-compiled

      - name: Prove checked-in assets match the complete rebuild
        run: |
          diff -qr \
            dictionaries/system/compiled/language_features.d \
            work/language-features-compiled \
            | tee work/language-features-diff.txt

      - name: Validate runtime and workflow safety
        run: |
          pytest -q \
            tests/test_compiled_language_assets.py \
            tests/test_workflow_safety_contract.py

      - name: Upload compiled-language verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-assets-verification
          path: |
            work/language-features-compiled
            work/language-features-diff.txt
          if-no-files-found: error
          retention-days: 30

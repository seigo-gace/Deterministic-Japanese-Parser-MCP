name: Compile Language Assets

on:
  workflow_dispatch:
  push:
    paths:
      - "dictionaries/system/language_features.d/**"
      - "tools/compile_language_features.py"
      - "src/deterministic_japanese_parser_mcp/literal_index.py"
      - ".github/workflows/language-assets.yml"
  pull_request:
    paths:
      - "dictionaries/system/language_features.d/**"
      - "tools/compile_language_features.py"
      - "src/deterministic_japanese_parser_mcp/literal_index.py"
      - ".github/workflows/language-assets.yml"

permissions:
  contents: write

concurrency:
  group: language-assets-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-record:
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build-only parser dependency
        run: python -m pip install "PyYAML>=6.0.3,<7"
      - name: Compile deterministic language assets
        run: |
          python tools/compile_language_features.py
          python tools/compile_language_features.py --check
      - name: Record immutable compiled assets
        run: |
          if git diff --quiet -- dictionaries/system/compiled/language_features.d; then
            echo "Compiled assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionaries/system/compiled/language_features.d
          git commit -m "build: refresh compiled language assets"
          git push origin "HEAD:${HEAD_BRANCH}"

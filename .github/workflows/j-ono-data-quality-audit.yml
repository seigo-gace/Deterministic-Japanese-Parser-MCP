      - name: Measure existing Open Lexicon POS evidence coverage
        run: |
          python - <<'PY'
          import gzip
          import json
          from collections import Counter, defaultdict
          from pathlib import Path
          import unicodedata

          def norm(value):
              return unicodedata.normalize("NFKC", str(value or "")).strip()

          def kana_fold(value):
              value = norm(value)
              return "".join(
                  chr(ord(ch) - 0x60) if "\u30a1" <= ch <= "\u30f6" else ch
                  for ch in value
              )

          def is_japanese(value):
              return any(
                  "\u3040" <= ch <= "\u30ff" or
                  "\u3400" <= ch <= "\u9fff"
                  for ch in value
              )

          def is_hiragana_source_form(value):
              value = norm(value)
              has_hiragana = any("\u3040" <= ch <= "\u309f" for ch in value)
              has_katakana = any("\u30a0" <= ch <= "\u30ff" for ch in value)
              has_latin = any(("a" <= ch.lower() <= "z") for ch in value)
              return bool(value) and has_hiragana and not has_katakana and not has_latin

          surface_records = defaultdict(list)
          for shard in sorted(Path("dictionaries/system/compiled/open_lexicon/records").glob("*.jsonl.gz")):
              with gzip.open(shard, "rt", encoding="utf-8") as handle:
                  for line in handle:
                      if not line.strip():
                          continue
                      row = json.loads(line)
                      pos = sorted({norm(x) for x in row.get("part_of_speech") or [] if norm(x)})
                      if not pos:
                          continue
                      readings = sorted({kana_fold(x) for x in row.get("readings") or [] if norm(x)})
                      source = row.get("source") or {}
                      compact = {
                          "record_id": norm(row.get("record_id")),
                          "pos": pos,
                          "readings": readings,
                          "dataset": norm(source.get("dataset")),
                      }
                      for value in [row.get("lemma"), *(row.get("surfaces") or [])]:
                          key = norm(value)
                          if key and is_japanese(key):
                              surface_records[key].append(compact)

          surface_counts = Counter()
          strong_counts = Counter()
          surface_pos_frequency = Counter()
          strong_pos_frequency = Counter()
          evidence_rows = []

          for line in Path("work/j-ono-rebuilt-source-adapter.jsonl").read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              japanese_surfaces = sorted({
                  norm(x) for x in row.get("surfaces") or []
                  if norm(x) and is_japanese(norm(x))
              })
              source_readings = sorted({
                  kana_fold(x) for x in row.get("surfaces") or []
                  if is_hiragana_source_form(x)
              })

              surface_candidates = []
              for surface in japanese_surfaces:
                  surface_candidates.extend(surface_records.get(surface, []))
              surface_pos = sorted({p for cand in surface_candidates for p in cand["pos"]})

              if not surface_candidates:
                  surface_status = "NO_POS_EVIDENCE"
              elif len(surface_pos) == 1:
                  surface_status = "UNIQUE_POS_EVIDENCE"
                  surface_pos_frequency[surface_pos[0]] += 1
              else:
                  surface_status = "AMBIGUOUS_POS_EVIDENCE"
              surface_counts[surface_status] += 1

              strong_candidates = []
              source_reading_set = set(source_readings)
              for cand in surface_candidates:
                  if source_reading_set.intersection(cand["readings"]):
                      strong_candidates.append(cand)
              strong_pos = sorted({p for cand in strong_candidates for p in cand["pos"]})

              if not strong_candidates:
                  strong_status = "NO_STRONG_POS_EVIDENCE"
              elif len(strong_pos) == 1:
                  strong_status = "UNIQUE_STRONG_POS_EVIDENCE"
                  strong_pos_frequency[strong_pos[0]] += 1
              else:
                  strong_status = "AMBIGUOUS_STRONG_POS_EVIDENCE"
              strong_counts[strong_status] += 1

              if surface_status != "NO_POS_EVIDENCE" or strong_status != "NO_STRONG_POS_EVIDENCE":
                  evidence_rows.append({
                      "adapter_record_id": row["adapter_record_id"],
                      "source_record_id": (row.get("source") or {}).get("source_record_id"),
                      "surfaces": row.get("surfaces") or [],
                      "meanings": row.get("meanings") or [],
                      "source_readings": source_readings,
                      "surface_status": surface_status,
                      "surface_candidate_pos": surface_pos,
                      "strong_status": strong_status,
                      "strong_candidate_pos": strong_pos,
                      "strong_source_datasets": sorted({
                          cand["dataset"] for cand in strong_candidates if cand["dataset"]
                      }),
                      "strong_open_lexicon_record_ids": sorted({
                          cand["record_id"] for cand in strong_candidates if cand["record_id"]
                      }),
                  })

          report = {
              "record_count": sum(surface_counts.values()),
              "surface_only": {
                  "unique_pos_evidence_records": surface_counts["UNIQUE_POS_EVIDENCE"],
                  "ambiguous_pos_evidence_records": surface_counts["AMBIGUOUS_POS_EVIDENCE"],
                  "no_pos_evidence_records": surface_counts["NO_POS_EVIDENCE"],
                  "unique_pos_candidate_frequency": dict(sorted(surface_pos_frequency.items())),
              },
              "surface_plus_reading": {
                  "unique_pos_evidence_records": strong_counts["UNIQUE_STRONG_POS_EVIDENCE"],
                  "ambiguous_pos_evidence_records": strong_counts["AMBIGUOUS_STRONG_POS_EVIDENCE"],
                  "no_pos_evidence_records": strong_counts["NO_STRONG_POS_EVIDENCE"],
                  "unique_pos_candidate_frequency": dict(sorted(strong_pos_frequency.items())),
              },
              "automatic_pos_fill": False,
              "runtime_promotion": False,
          }
          Path("work/j-ono-pos-evidence-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path("work/j-ono-pos-evidence.jsonl").open("w", encoding="utf-8", newline="\n") as out:
              for item in evidence_rows:
                  out.write(json.dumps(item, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n")
          print("J_ONO_POS_EVIDENCE=" + json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY


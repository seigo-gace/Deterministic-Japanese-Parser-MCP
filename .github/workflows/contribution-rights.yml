name: Contribution Rights

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: contribution-rights-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contribution-rights:
    name: DCO and owner rights review
    runs-on: ubuntu-latest
    steps:
      - name: Verify external contribution rights
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          owner = os.environ["GH_REPOSITORY_OWNER"]
          pr_number = os.environ["PR_NUMBER"]
          author = os.environ["PR_AUTHOR"]
          head_sha = os.environ["PR_HEAD_SHA"]

          if author.casefold() == owner.casefold():
              print("Project Owner pull request: inbound DCO/CLA gate is not required.")
              raise SystemExit(0)

          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "djpmcp-contribution-rights",
          }

          def get_all(path: str) -> list[dict]:
              items: list[dict] = []
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  url = f"{api_root}{path}{separator}per_page=100&page={page}"
                  request = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.load(response)
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", errors="replace")
                      raise RuntimeError(f"GitHub API failed: {exc.code} {detail}") from exc
                  if not isinstance(payload, list):
                      raise RuntimeError(f"Expected list response from {url}")
                  items.extend(payload)
                  if len(payload) < 100:
                      return items
                  page += 1

          signoff = re.compile(
              r"(?im)^Signed-off-by:\s+.+?\s+<[^<>\s]+@[^<>\s]+>\s*$"
          )
          commits = get_all(f"/pulls/{pr_number}/commits")
          unsigned: list[str] = []
          for item in commits:
              sha = str(item.get("sha", ""))
              message = str(item.get("commit", {}).get("message", ""))
              if not signoff.search(message):
                  unsigned.append(sha[:12] or "unknown")

          if unsigned:
              print("Missing valid DCO Signed-off-by line:", ", ".join(unsigned))
              print("Amend each external contribution commit with: git commit --amend -s")
              raise SystemExit(1)

          reviews = get_all(f"/pulls/{pr_number}/reviews")
          accepted_review = None
          exempt_review = None

          for review in reviews:
              reviewer = str(review.get("user", {}).get("login", ""))
              state = str(review.get("state", "")).upper()
              commit_id = str(review.get("commit_id", ""))
              body = str(review.get("body") or "")
              if reviewer.casefold() != owner.casefold():
                  continue
              if state != "APPROVED" or commit_id != head_sha:
                  continue

              status_match = re.search(
                  r"(?im)^CLA-Status:\s*(accepted|exempt)\s*$", body
              )
              if not status_match:
                  continue

              status = status_match.group(1).casefold()
              if status == "accepted":
                  version_ok = re.search(r"(?im)^CLA-Version:\s*\S.+$", body)
                  record_ok = re.search(r"(?im)^CLA-Record:\s*\S.+$", body)
                  if version_ok and record_ok:
                      accepted_review = review
              elif status == "exempt":
                  reason_ok = re.search(r"(?im)^CLA-Reason:\s*\S.+$", body)
                  if reason_ok:
                      exempt_review = review

          if not accepted_review and not exempt_review:
              print("No current-head APPROVED review from the Project Owner contains a valid CLA record.")
              print("Required review body for an accepted CLA:")
              print("CLA-Status: accepted")
              print("CLA-Version: <version>")
              print("CLA-Record: <private record identifier or digest>")
              print("Or, for a written exemption:")
              print("CLA-Status: exempt")
              print("CLA-Reason: <non-substantive contribution reason>")
              raise SystemExit(1)

          record_type = "accepted" if accepted_review else "exempt"
          print(
              f"Contribution rights verified: commits={len(commits)} "
              f"dco=pass cla={record_type} head={head_sha}"
          )
          PY

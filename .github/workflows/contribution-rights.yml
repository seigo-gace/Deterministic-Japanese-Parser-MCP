name: Contribution Rights

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: contribution-rights-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contribution-rights:
    name: DCO and owner rights review
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch policy code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify external contribution rights
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_PROJECT_OWNER: seigo-gace
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_contribution_rights.py

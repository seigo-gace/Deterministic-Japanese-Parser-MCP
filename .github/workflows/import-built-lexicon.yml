name: Import Built Lexicon Snapshot

on:
  push:
    branches:
      - feature/import-all-dictionaries
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  import-built-lexicon:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.head_ref == 'feature/import-all-dictionaries')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/import-all-dictionaries
          fetch-depth: 0

      - name: Download latest successful repository release artifact
        uses: actions/download-artifact@v4
        with:
          name: deterministic-japanese-parser-offline-release
          path: _artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30895747914

      - name: Extract lexicon from built wheel
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(find _artifact/dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$WHEEL"
          rm -rf _wheel
          mkdir -p _wheel
          unzip -q "$WHEEL" -d _wheel
          SOURCE=$(find _wheel -type d -path '*/data/share/deterministic-japanese-parser-mcp/dictionaries/system/lexicon.d' -print -quit)
          test -n "$SOURCE"
          rm -rf dictionaries/system/lexicon.d
          mkdir -p dictionaries/system
          cp -R "$SOURCE" dictionaries/system/lexicon.d

      - name: Count and validate extracted records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import gzip
          import json

          root = Path('dictionaries/system/lexicon.d')
          if not root.is_dir():
              raise SystemExit('lexicon.d was not copied')

          total = 0
          files = []
          for path in sorted(root.rglob('*.jsonl')):
              with path.open('rt', encoding='utf-8') as handle:
                  count = sum(1 for line in handle if line.strip())
              files.append((path.as_posix(), count, path.stat().st_size))
              total += count

          for path in sorted(root.rglob('*.jsonl.gz')):
              with gzip.open(path, 'rt', encoding='utf-8') as handle:
                  count = 0
                  for line in handle:
                      if not line.strip():
                          continue
                      json.loads(line)
                      count += 1
              files.append((path.as_posix(), count, path.stat().st_size))
              total += count

          for path, count, size in files:
              print(f'{path}\trecords={count}\tbytes={size}')
          print(f'TOTAL_RECORDS={total}')
          print(f'TOTAL_FILES={len(files)}')
          if total != 120000:
              raise SystemExit(f'expected 120000 records, got {total}')
          PY

      - name: Commit extracted lexicon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dictionaries/system/lexicon.d/
          git diff --cached --stat
          git commit -m 'feat: import built open lexicon snapshot'
          git push origin HEAD:feature/import-all-dictionaries

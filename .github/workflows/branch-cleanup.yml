name: One-time stale branch cleanup

on:
  push:
    branches:
      - agent/deterministic-data-pipeline-correction-20260806

permissions:
  contents: write

jobs:
  delete-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current working branch
        uses: actions/checkout@v4
        with:
          ref: agent/deterministic-data-pipeline-correction-20260806
          fetch-depth: 1

      - name: Delete audited stale remote branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'agent/brand-governance-2026-08'
            'agent/complete-dictionary-supply-chain'
            'agent/comprehensive-dictionary-expansion-2026-08'
            'agent/context-v3-5000-run-20260805'
            'agent/context-v3-5000'
            'agent/context-v3-stage3-automation-20260805'
            'agent/context-v3-stage3-category-pack-001-20260805'
            'agent/context-v3-stage3-category-pack-002-20260805'
            'agent/context-v3-stage3-substring-review-20260805'
            'agent/dictionary-expansion-2026-08'
            'agent/expand-context-source-collection-2026-08-05'
            'agent/improve-speed-accuracy'
            'agent/initial-public-implementation'
            'agent/initial-public-implementation-final'
            'agent/initial-public-implementation-sync'
            'agent/language-feature-runtime-2026-08'
            'agent/meaning-graph-runtime'
            'agent/open-lexicon-accuracy-hardening'
            'agent/open-lexicon-accuracy-validation'
            'agent/public-repository-hardening-2026-08'
            'agent/semantic-quality-95-2026-08'
            'agent/strict-performance-release-gates'
            'agent/unified-data-supply-pipeline-clean-20260806'
            'agent/unified-semantic-data-pipeline-20260805'
            'docs/split-readme-and-public-entrypoints-20260805'
            'docs/validation-community-routing-20260805'
            'feature/import-all-dictionaries'
            'fix/context-v3-stage3-review-20260805'
            'fix/120k-lexicon-unified-audit-20260805'
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              git push origin --delete "${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

          echo 'Remaining remote branches:'
          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort

          mapfile -t remaining < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)
          expected=(
            'agent/deterministic-data-pipeline-correction-20260806'
            'main'
          )

          if [[ "${remaining[*]}" != "${expected[*]}" ]]; then
            echo 'Unexpected branch set remains.' >&2
            printf 'Actual: %s\n' "${remaining[*]}" >&2
            printf 'Expected: %s\n' "${expected[*]}" >&2
            exit 1
          fi

          echo 'Branch cleanup verified: only main and the current working branch remain.'

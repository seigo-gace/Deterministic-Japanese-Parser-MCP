name: Public Semantic Source Acquisition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/public_semantic_sources.json"
      - "tools/public_semantic_sources.py"
      - "tools/public_kanji_sources.py"
      - ".github/workflows/public-semantic-sources.yml"

permissions:
  contents: read

jobs:
  acquire-and-normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install acquisition-only parser dependency
        run: pip install openpyxl==3.1.5
      - name: Validate source policy manifest and Python syntax
        run: |
          python tools/public_semantic_sources.py validate-manifest --manifest config/public_semantic_sources.json
          python -m py_compile tools/public_semantic_sources.py tools/public_kanji_sources.py
      - name: Run deterministic adapter self-test
        run: python tools/public_semantic_sources.py self-test
      - name: Prepare base-source manifest
        run: |
          mkdir -p work
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('config/public_semantic_sources.json')
          manifest = json.loads(source.read_text(encoding='utf-8'))
          base_adapters = {'wnja_sqlite_release', 'okinawa_xlsx'}
          for item in manifest['sources']:
              if item.get('status') == 'enabled' and item.get('adapter') not in base_adapters:
                  item['status'] = 'specialized-adapter'
          Path('work/public-semantic-base-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Acquire and normalize base public semantic sources
        run: |
          python tools/public_semantic_sources.py acquire \
            --manifest work/public-semantic-base-manifest.json \
            --output-root work/public-semantic-sources \
            --report reports/public-semantic-sources-report.json \
            --lock reports/public-semantic-sources-lock.json
      - name: Acquire KANJIDIC2 and Unicode Unihan with cross-source meaning coverage
        run: |
          python tools/public_kanji_sources.py \
            --manifest config/public_semantic_sources.json \
            --output-root work/public-semantic-sources \
            --report reports/public-semantic-sources-report.json \
            --lock reports/public-semantic-sources-lock.json
      - name: Enforce meaning completeness and source lock evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('config/public_semantic_sources.json').read_text(encoding='utf-8'))
          report = json.loads(Path('reports/public-semantic-sources-report.json').read_text(encoding='utf-8'))
          locks = json.loads(Path('reports/public-semantic-sources-lock.json').read_text(encoding='utf-8'))
          enabled = [item for item in manifest['sources'] if item.get('status') == 'enabled']
          if report.get('meaning_complete') is not True:
              coverage = report.get('cross_source_coverage') or {}
              raise SystemExit(
                  'MEANING_EVIDENCE_INCOMPLETE: '
                  f"uncovered={coverage.get('uncovered_records')} "
                  f"sample={coverage.get('uncovered_sample')}"
              )
          if report.get('llm_api_used') is not False or report.get('web_scraping_used') is not False:
              raise SystemExit('ACQUISITION_BOUNDARY_VIOLATION')
          if report.get('total_records', 0) <= 0:
              raise SystemExit('NO_NORMALIZED_RECORDS')
          if len(locks.get('sources', [])) != len(enabled):
              raise SystemExit(
                  f"SOURCE_LOCK_COUNT_MISMATCH: locks={len(locks.get('sources', []))} enabled={len(enabled)}"
              )
          specs = {item['id']: item for item in enabled}
          for item in locks['sources']:
              source_id = item.get('source_id')
              if len(str(item.get('source_sha256') or '')) != 64:
                  raise SystemExit(f'SOURCE_DIGEST_MISSING:{source_id}')
              if len(str(item.get('normalized_sha256') or '')) != 64:
                  raise SystemExit(f'NORMALIZED_DIGEST_MISSING:{source_id}')
              expected = str(specs[source_id].get('expected_source_sha256') or '')
              if expected and expected.casefold() != str(item['source_sha256']).casefold():
                  raise SystemExit(f'PINNED_SOURCE_DIGEST_MISMATCH:{source_id}')
          coverage = report.get('cross_source_coverage') or {}
          print({
              'enabled_sources': len(enabled),
              'semantic_records': report['total_records'],
              'meaning_complete': report['meaning_complete'],
              'kanjidic_source_rows': coverage.get('target_source_rows'),
              'kanjidic_direct_meaning': coverage.get('target_direct_meaning_records'),
              'kanjidic_fallback_covered': coverage.get('fallback_covered_records'),
              'kanjidic_uncovered': coverage.get('uncovered_records'),
          })
          PY
      - name: Upload normalized meaning references and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-semantic-sources-${{ github.sha }}
          path: |
            work/public-semantic-sources/reference/*.jsonl
            work/public-semantic-sources/unresolved/*.jsonl
            work/public-semantic-sources/licenses/*
            reports/public-semantic-sources-report.json
            reports/public-semantic-sources-lock.json
          if-no-files-found: warn
          retention-days: 30

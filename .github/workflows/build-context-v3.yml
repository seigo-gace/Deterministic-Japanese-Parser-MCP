name: Rebuild Context Data v3 Candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-v3-candidate-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML writer
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0.3,<7"

      - name: Decode and validate deterministic builder
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/build_context_v3.py.gz.b64 | gzip -d > /tmp/build_context_v3.py
          sed -i 's/adds exactly 3,855/adds exactly 3,856/' /tmp/build_context_v3.py
          python -m py_compile /tmp/build_context_v3.py

      - name: Download pinned candidate sources for manual comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/context-v3
          curl -L --fail --retry 5 --retry-delay 5 \
            -o .cache/context-v3/kaikki-japanese.jsonl \
            https://kaikki.org/dictionary/Japanese/kaikki.org-dictionary-Japanese.jsonl
          curl -L --fail --retry 5 --retry-delay 3 \
            -o .cache/context-v3/living-slang.json \
            https://raw.githubusercontent.com/1Selxo/living-japanese-slang-dictionary/main/japanese_slang_dict.json
          curl -L --fail --retry 5 --retry-delay 3 \
            -o .cache/context-v3/j-ono-data.json \
            https://raw.githubusercontent.com/ObakeConstructs/j-ono-data/main/json/j-ono-data.json
          sha256sum .cache/context-v3/* | tee .cache/context-v3/source_checksums.sha256

      - name: Rebuild candidates outside the repository tree
        run: |
          rm -rf work/context-v3-rebuild
          python /tmp/build_context_v3.py \
            --existing research/context_collection/CANDIDATE_SURFACES_2026-08-05.md \
            --kaikki .cache/context-v3/kaikki-japanese.jsonl \
            --living-slang .cache/context-v3/living-slang.json \
            --j-ono .cache/context-v3/j-ono-data.json \
            --output work/context-v3-rebuild
          cp .cache/context-v3/source_checksums.sha256 \
            work/context-v3-rebuild/source_checksums.sha256

      - name: Validate manual rebuild
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("work/context-v3-rebuild")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          validation = json.loads((root / "validation.json").read_text(encoding="utf-8"))
          assert validation["ok"] is True, validation
          assert manifest["total_entries"] == 5000, manifest
          assert manifest["global_unique_surface_count"] == 5000, manifest
          assert sum(1 for _ in root.glob("*/*.yaml")) == 5000
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Create portable comparison archive
        run: |
          tar -C work \
            -czf work/context-expansion-v3-5000-rebuild.tar.gz \
            context-v3-rebuild
          sha256sum work/context-expansion-v3-5000-rebuild.tar.gz \
            > work/context-expansion-v3-5000-rebuild.tar.gz.sha256

      - name: Upload manual rebuild evidence
        uses: actions/upload-artifact@v4
        with:
          name: context-expansion-v3-5000-manual-rebuild
          path: |
            work/context-expansion-v3-5000-rebuild.tar.gz
            work/context-expansion-v3-5000-rebuild.tar.gz.sha256
            work/context-v3-rebuild/manifest.json
            work/context-v3-rebuild/validation.json
            work/context-v3-rebuild/source_checksums.sha256
          retention-days: 30

name: Build Context Data v3 5000

on:
  workflow_dispatch:
  push:
    branches:
      - agent/context-v3-5000
      - agent/context-v3-5000-data
    paths:
      - scripts/build_context_v3.py.gz.b64
      - .github/workflows/build-context-v3.yml
      - research/context_collection/CANDIDATE_SURFACES_2026-08-05.md
      - research/context_collection/expansion_v3/BUILD_REQUEST.json
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - scripts/build_context_v3.py.gz.b64
      - .github/workflows/build-context-v3.yml
      - research/context_collection/CANDIDATE_SURFACES_2026-08-05.md
      - research/context_collection/expansion_v3/BUILD_REQUEST.json

permissions:
  contents: write

concurrency:
  group: context-v3-5000-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML writer
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Decode and validate deterministic builder
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/build_context_v3.py.gz.b64 | gzip -d > /tmp/build_context_v3.py
          sed -i 's/adds exactly 3,855/adds exactly 3,856/' /tmp/build_context_v3.py
          python -m py_compile /tmp/build_context_v3.py

      - name: Download open candidate sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/context-v3
          curl -L --fail --retry 5 --retry-delay 5 \
            -o .cache/context-v3/kaikki-japanese.jsonl \
            https://kaikki.org/dictionary/Japanese/kaikki.org-dictionary-Japanese.jsonl
          curl -L --fail --retry 5 --retry-delay 3 \
            -o .cache/context-v3/living-slang.json \
            https://raw.githubusercontent.com/1Selxo/living-japanese-slang-dictionary/main/japanese_slang_dict.json
          curl -L --fail --retry 5 --retry-delay 3 \
            -o .cache/context-v3/j-ono-data.json \
            https://raw.githubusercontent.com/ObakeConstructs/j-ono-data/main/json/j-ono-data.json
          sha256sum .cache/context-v3/* | tee .cache/context-v3/source_checksums.sha256

      - name: Generate exactly 5,000 globally unique candidates
        run: |
          python /tmp/build_context_v3.py \
            --existing research/context_collection/CANDIDATE_SURFACES_2026-08-05.md \
            --kaikki .cache/context-v3/kaikki-japanese.jsonl \
            --living-slang .cache/context-v3/living-slang.json \
            --j-ono .cache/context-v3/j-ono-data.json \
            --output research/context_collection/expansion_v3
          cp .cache/context-v3/source_checksums.sha256 \
            research/context_collection/expansion_v3/source_checksums.sha256

      - name: Validate generated collection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/context_collection/expansion_v3')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          validation = json.loads((root / 'validation.json').read_text(encoding='utf-8'))
          assert validation['ok'] is True, validation
          assert manifest['total_entries'] == 5000, manifest
          assert manifest['global_unique_surface_count'] == 5000, manifest
          assert sum(1 for _ in root.glob('*/*.yaml')) == 5000
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Create portable archive
        run: |
          tar -C research/context_collection \
            -czf research/context_collection/context-expansion-v3-5000.tar.gz \
            expansion_v3
          sha256sum research/context_collection/context-expansion-v3-5000.tar.gz \
            > research/context_collection/context-expansion-v3-5000.tar.gz.sha256

      - name: Commit generated candidate data to the branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/context_collection/expansion_v3 \
            research/context_collection/context-expansion-v3-5000.tar.gz \
            research/context_collection/context-expansion-v3-5000.tar.gz.sha256
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'data: build 5000 context candidates [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: context-expansion-v3-5000
          path: |
            research/context_collection/context-expansion-v3-5000.tar.gz
            research/context_collection/context-expansion-v3-5000.tar.gz.sha256
            research/context_collection/expansion_v3/manifest.json
            research/context_collection/expansion_v3/validation.json
          retention-days: 30

name: Finalize public implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/initial-public-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/initial-public-implementation
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          wc -c .bootstrap/repo.part*
          sha256sum --check <<'CHECKSUMS'
          1e9ffc48c98de672e5b11d9631e4ab8150f1e8c20ac819fb55841b594f77bc13  .bootstrap/repo.part00
          4292fd526162c1268a30badf5ace117534c19d512c0607db8d13b7d65f888e8e  .bootstrap/repo.part01
          098d0fea7213a10324e4fff8b4d0ee5b170d9c9ec34ffb1d2530f80d189e5980  .bootstrap/repo.part02a
          7068904d7aec5e3ffc06b6f480d4382a89374e012044e8e291059c163af9a3ff  .bootstrap/repo.part02b
          0a2c5f8ff43558563cd108b20a2348d5209e5d9aaf20528be091d873201db202  .bootstrap/repo.part03a
          e08421dbf8b3b738fc872e12fbe21fc88a19cfb05f898aad8a67324640bfad88  .bootstrap/repo.part03b
          d0d7b6e1ae62861b3a8d22c9128d100668bb775f265c84e029897c08f235cee7  .bootstrap/repo.part04
          13fd4153bc5453926da2568671b52f74635a6876c03b2c159af82d835cf9acdc  .bootstrap/repo.part05
          1e785485a19ec19f13acbf12effd58d049d40adb3e5bc0090d4a85491e843e12  .bootstrap/repo.part06
          CHECKSUMS
          cat .bootstrap/repo.part* > /tmp/repo.tar.gz.b64
          base64 --decode /tmp/repo.tar.gz.b64 > /tmp/repo.tar.gz
          echo '098aef85f61d2375b28a1a6f222ba600dd2d832ea3e2ac19dfd58e913a0a9e84  /tmp/repo.tar.gz' | sha256sum --check
          mkdir -p /tmp/final-source
          tar -xzf /tmp/repo.tar.gz -C /tmp/final-source

      - name: Install and validate final source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/final-source
          cd /tmp/final-source
          python tools/validator.py
          pytest -q
          python -m compileall -q src tools scripts tests

      - name: Replace branch tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/final-source/. .
          git status --short

      - name: Commit finalized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finalize public implementation'
          git push origin HEAD:agent/initial-public-implementation

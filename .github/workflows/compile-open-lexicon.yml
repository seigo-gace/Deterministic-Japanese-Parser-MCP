name: Compile 120k Open Lexicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dictionaries/system/lexicon.d/**"
      - "dictionaries/system/compiled/open_lexicon/**"
      - "src/deterministic_japanese_parser_mcp/dictionaries.py"
      - "src/deterministic_japanese_parser_mcp/models.py"
      - "src/deterministic_japanese_parser_mcp/lexical_graph.py"
      - "src/deterministic_japanese_parser_mcp/open_lexicon_runtime.py"
      - "src/deterministic_japanese_parser_mcp/tokenizer.py"
      - "tools/compile_open_lexicon_runtime.py"
      - "tools/validate_compiled_open_lexicon.py"
      - "tests/test_compiled_open_lexicon.py"
      - "tests/test_open_lexicon_runtime.py"
      - "tests/test_lexical_meaning_graph.py"
      - "tests/test_repository_lexicon_integration.py"
      - "tests/test_workflow_safety_contract.py"
      - "pyproject.toml"
      - ".github/workflows/compile-open-lexicon.yml"
  pull_request:
    paths:
      - "dictionaries/system/lexicon.d/**"
      - "dictionaries/system/compiled/open_lexicon/**"
      - "src/deterministic_japanese_parser_mcp/dictionaries.py"
      - "src/deterministic_japanese_parser_mcp/models.py"
      - "src/deterministic_japanese_parser_mcp/lexical_graph.py"
      - "src/deterministic_japanese_parser_mcp/open_lexicon_runtime.py"
      - "src/deterministic_japanese_parser_mcp/tokenizer.py"
      - "tools/compile_open_lexicon_runtime.py"
      - "tools/validate_compiled_open_lexicon.py"
      - "tests/test_compiled_open_lexicon.py"
      - "tests/test_open_lexicon_runtime.py"
      - "tests/test_lexical_meaning_graph.py"
      - "tests/test_repository_lexicon_integration.py"
      - "tests/test_workflow_safety_contract.py"
      - "pyproject.toml"
      - ".github/workflows/compile-open-lexicon.yml"

permissions:
  contents: read

concurrency:
  group: compile-open-lexicon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-runtime-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rebuild all 120,000 records in a temporary directory
        run: |
          set -euo pipefail
          rm -rf work/open-lexicon-compiled reports/open-lexicon-runtime
          mkdir -p work reports/open-lexicon-runtime
          python tools/compile_open_lexicon_runtime.py \
            --input-root dictionaries/system/lexicon.d \
            --output-root work/open-lexicon-compiled \
            --expected-records 120000 \
            --record-shard-size 10000 \
            --report reports/open-lexicon-runtime/compile-report.json

      - name: Validate rebuilt indexes and safety boundaries
        run: |
          set -euo pipefail
          python tools/validate_compiled_open_lexicon.py \
            --root work/open-lexicon-compiled \
            --expected-records 120000 \
            --output reports/open-lexicon-runtime/validation.json

      - name: Prove checked-in runtime data matches the complete rebuild
        run: |
          set -euo pipefail
          diff -qr \
            dictionaries/system/compiled/open_lexicon \
            work/open-lexicon-compiled \
            | tee reports/open-lexicon-runtime/deterministic-diff.txt

      - name: Verify split files operate as one dictionary
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_compiled_open_lexicon.py \
            tests/test_open_lexicon_runtime.py \
            tests/test_lexical_meaning_graph.py \
            tests/test_repository_lexicon_integration.py \
            tests/test_workflow_safety_contract.py

      - name: Verify ParserEngine loads every runtime shard before readiness
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from deterministic_japanese_parser_mcp import AnalyzeRequest, ParserEngine

          engine = ParserEngine()
          runtime = engine.bundle.open_lexicon

          assert engine.bundle.lexicon["lookup_backend"] == "compiled-index"
          assert engine.bundle.lexicon["record_count"] == 120000
          assert runtime.available is True
          assert runtime.records_preloaded is True
          assert len(runtime.record_locator) == 120000
          assert len(runtime._shard_cache) == 12
          assert sum(len(shard) for shard in runtime._shard_cache.values()) == 120000

          response = engine.analyze(
              AnalyzeRequest(original_text="日本を確認する。", deadline_ms=5000)
          )
          matched = [
              token
              for token in response.tokens
              if token.lexical_candidate_total > 0
          ]
          assert matched, response.model_dump()
          assert response.meaning_graph.lexical_nodes

          report = {
              "status": "PASS",
              "lookup_backend": engine.bundle.lexicon["lookup_backend"],
              "record_count": engine.bundle.lexicon["record_count"],
              "runtime_shards": len(runtime._shard_cache),
              "preloaded_records": sum(
                  len(shard) for shard in runtime._shard_cache.values()
              ),
              "record_locator_entries": len(runtime.record_locator),
              "matched_token_count": len(matched),
              "lexical_node_count": len(response.meaning_graph.lexical_nodes),
          }
          output = Path("reports/open-lexicon-runtime/runtime-integration.json")
          output.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-lexicon-runtime-evidence
          path: |
            reports/open-lexicon-runtime
            work/open-lexicon-compiled/manifest.json
            dictionaries/system/compiled/open_lexicon/manifest.json
          if-no-files-found: error
          retention-days: 30

name: Apply Stage 3 Lexical Graph

on:
  workflow_dispatch:
  push:
    branches:
      - feature/import-all-dictionaries
    paths:
      - "tools/apply_stage3_lexical_graph_patch.py"
      - ".github/workflows/apply-stage3-lexical-graph.yml"

permissions:
  contents: write

concurrency:
  group: apply-stage3-lexical-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: feature/import-all-dictionaries
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic source patch
        run: |
          set -euo pipefail
          python tools/apply_stage3_lexical_graph_patch.py
          rm tools/apply_stage3_lexical_graph_patch.py
          rm .github/workflows/apply-stage3-lexical-graph.yml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate Stage 3 integration
        run: |
          set -euo pipefail
          python -m compileall -q src tools scripts tests
          pytest -q \
            tests/test_lexical_meaning_graph.py \
            tests/test_open_lexicon_runtime.py \
            tests/test_compiled_open_lexicon.py

      - name: Commit Stage 3 implementation
        env:
          TARGET_BRANCH: feature/import-all-dictionaries
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect lexical candidates to MeaningGraph"
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"

name: Reading Boundary Audit

on:
  push:
    branches:
      - audit/reading-boundary-20260915

permissions:
  contents: read

jobs:
  boundary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mkdir -p reports
      - name: Apply candidate reading fix in workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/apply_reading_boundary_fix.py")
          text = p.read_text(encoding="utf-8")
          p.write_text(text.replace("'''", '\"\"\"'), encoding="utf-8")
          PY
          python -m py_compile scripts/apply_reading_boundary_fix.py
          python scripts/apply_reading_boundary_fix.py
      - name: Probe token and reading boundaries
        run: python scripts/reading_boundary_probe.py > reports/reading-probe-${{ matrix.python-version }}.json
      - name: Reading boundary audit only
        run: |
          set -o pipefail
          pytest -q tests/test_reading_boundary_audit.py 2>&1 | tee reports/reading-boundary-${{ matrix.python-version }}.txt
      - name: Preserve boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-boundary-${{ matrix.python-version }}
          path: |
            reports/reading-boundary-${{ matrix.python-version }}.txt
            reports/reading-probe-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 30

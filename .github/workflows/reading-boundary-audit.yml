name: Reading Boundary Audit

on:
  push:
    branches:
      - audit/reading-boundary-20260915

permissions:
  contents: read

jobs:
  boundary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mkdir -p reports
      - name: Reading boundary audit only
        run: |
          set -o pipefail
          pytest -q tests/test_reading_boundary_audit.py 2>&1 | tee reports/reading-boundary-${{ matrix.python-version }}.txt
      - name: Preserve boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-boundary-${{ matrix.python-version }}
          path: reports/reading-boundary-${{ matrix.python-version }}.txt
          if-no-files-found: error
          retention-days: 30

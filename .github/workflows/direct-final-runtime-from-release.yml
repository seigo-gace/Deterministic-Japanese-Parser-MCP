name: Direct Final Runtime From GitHub Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "GitHub Release tag containing the Direct Final source bundle assets"
        required: true
      asset-pattern:
        description: "Release asset glob for Direct Final files"
        required: true
        default: "mcp-runtime-final-*"
      bundle-root:
        description: "Directory inside extracted asset archives; leave empty to auto-detect"
        required: false
        default: ""
      expected-records:
        description: "Expected Direct Final runtime records"
        required: true

permissions:
  contents: read

jobs:
  compile-and-verify-direct-final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ inputs['release-tag'] }}
      ASSET_PATTERN: ${{ inputs['asset-pattern'] }}
      BUNDLE_ROOT: ${{ inputs['bundle-root'] }}
      EXPECTED_RECORDS: ${{ inputs['expected-records'] }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Verify checked-in semantic baseline
        run: |
          python -m pytest tests/test_direct_final_deployment_contract.py
          python scripts/semantic_quality_contract.py \
            --check \
            --output reports/baseline-semantic-quality.json
          python scripts/semantic_holdout_contract.py \
            --check \
            --output reports/baseline-semantic-holdout.json

      - name: Download Direct Final manifest from GitHub Release
        run: |
          set -euo pipefail
          mkdir -p work/direct-final-release-input reports
          gh release download "$RELEASE_TAG" \
            --repo seigo-gace/Deterministic-Japanese-Parser-MCP \
            --pattern "manifest.json" \
            --dir work/direct-final-release-input
          find work/direct-final-release-input -maxdepth 1 -type f -name "*.zip" -print0 | xargs -0 -r -I{} unzip -q {} -d work/direct-final-release-input
          find work/direct-final-release-input -maxdepth 1 -type f \( -name "*.tar" -o -name "*.tar.gz" -o -name "*.tgz" \) -print0 | xargs -0 -r -I{} tar -xf {} -C work/direct-final-release-input
          test -f work/direct-final-release-input/manifest.json || find work/direct-final-release-input -name manifest.json -print -quit | grep -q .

      - name: Verify expected-records against manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          input_root = Path("work/direct-final-release-input")
          manifest_path = input_root / "manifest.json"
          if not manifest_path.is_file():
              found = next(input_root.rglob("manifest.json"), None)
              if found is None:
                  print("manifest.json not found", file=sys.stderr)
                  raise SystemExit(1)
              manifest_path = found
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = int(os.environ["EXPECTED_RECORDS"])
          actual = int((manifest.get("validation") or {}).get("full_json_records_validated", 0))
          if actual != expected:
              print(
                  f"expected-records mismatch: expected={expected} manifest={actual}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Restore compiled Direct Final ABI cache
        uses: actions/cache@v4
        id: compiled-abi-cache
        with:
          path: |
            dictionaries/system/compiled/open_lexicon
            dictionaries/system/compiled/canonical_dictionary_runtime
            dictionaries/system/compiled/direct_final_integration.json
            dictionaries/system/compiled/direct_final_support
          key: direct-final-abi-${{ runner.os }}-${{ hashFiles('work/direct-final-release-input/manifest.json') }}-${{ inputs['expected-records'] }}

      - name: Evaluate compiled ABI reuse readiness
        id: reuse-ready
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          input_root = Path("work/direct-final-release-input")
          manifest_path = input_root / "manifest.json"
          if not manifest_path.is_file():
              manifest_path = next(input_root.rglob("manifest.json"))
          integration_path = Path("dictionaries/system/compiled/direct_final_integration.json")
          ready = "false"
          if integration_path.is_file():
              integration = json.loads(integration_path.read_text(encoding="utf-8"))
              if (
                  integration.get("schema_version") == "djpmcp.direct-final-integration.v1"
                  and integration.get("target") == "Deterministic-Japanese-Parser-MCP"
                  and integration.get("factory_used") is False
                  and integration.get("source_manifest_sha256") == sha256(manifest_path)
              ):
                  ready = "true"
          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as handle:
              handle.write(f"ready={ready}\n")
          PY

      - name: Download Direct Final source bundle when compiled ABI is not reusable
        if: steps.compiled-abi-cache.outputs.cache-hit != 'true' || steps.reuse-ready.outputs.ready != 'true'
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo seigo-gace/Deterministic-Japanese-Parser-MCP \
            --pattern "manifest.json" \
            --pattern "$ASSET_PATTERN" \
            --pattern "mcp-runtime-support.jsonl.gz" \
            --dir work/direct-final-release-input
          find work/direct-final-release-input -maxdepth 1 -type f -name "*.zip" -print0 | xargs -0 -r -I{} unzip -q {} -d work/direct-final-release-input
          find work/direct-final-release-input -maxdepth 1 -type f \( -name "*.tar" -o -name "*.tar.gz" -o -name "*.tgz" \) -print0 | xargs -0 -r -I{} tar -xf {} -C work/direct-final-release-input
          test -f work/direct-final-release-input/manifest.json || find work/direct-final-release-input -name manifest.json -print -quit | grep -q .

      - name: Compile Direct Final runtime into existing ABIs
        run: |
          set -euo pipefail
          mkdir -p reports work/direct-final-runtime
          if [ -n "$BUNDLE_ROOT" ]; then
            INPUT_ROOT="work/direct-final-release-input/$BUNDLE_ROOT"
          else
            MANIFEST="$(find work/direct-final-release-input -name manifest.json -print -quit)"
            if [ -z "$MANIFEST" ]; then
              echo "manifest.json not found in downloaded GitHub Release assets" >&2
              exit 1
            fi
            INPUT_ROOT="$(dirname "$MANIFEST")"
          fi
          python tools/compile_direct_final_runtime.py \
            --manifest "$INPUT_ROOT/manifest.json" \
            --input-root "$INPUT_ROOT" \
            --system-root dictionaries/system \
            --work-root work/direct-final-runtime \
            | tee reports/direct-final-compile.json

      - name: Enforce completed semantic deployment contract
        run: |
          python scripts/direct_final_deployment_contract.py \
            --require-direct-final \
            --expected-source-records "$EXPECTED_RECORDS" \
            --output reports/direct-final-deployment-contract.json

      - name: Verify parser, dictionaries and runtime safety
        run: |
          python -m pytest \
            tests/test_direct_final_runtime_integration.py \
            tests/test_semantic_data_runtime.py
          python tools/validator.py --global-only
          python scripts/astera_latency_contract.py \
            --check \
            --rounds 30 \
            --stdio-rounds 20 \
            --target-ms 10 \
            --hard-ms 50 \
            --output reports/direct-final-astera-latency.json
          python -m compileall -q src tools scripts tests

      - name: Build wheel with Direct Final runtime
        run: python -m build --wheel --outdir dist

      - name: Verify Direct Final wheel outside repository
        run: |
          python -m venv --system-site-packages /tmp/djpmcp-direct-final-wheel
          /tmp/djpmcp-direct-final-wheel/bin/pip install \
            --no-index \
            --no-deps \
            --force-reinstall \
            dist/*.whl
          cd /tmp
          /tmp/djpmcp-direct-final-wheel/bin/python - <<'VERIFY_PY'
          from deterministic_japanese_parser_mcp import AnalyzeRequest, ParserEngine
          import os

          engine = ParserEngine()
          assert engine.bundle.open_lexicon.lookup_backend == "sqlite-index-v1"
          assert engine.bundle.open_lexicon.record_count == int(os.environ["EXPECTED_RECORDS"])
          assert engine.semantic_data.root.name == "canonical_dictionary_runtime"
          assert engine.semantic_data.record_count > 0
          response = engine.analyze(
              AnalyzeRequest(original_text="UIは残せ。APIだけ変更しろ。", deadline_ms=5000)
          )
          assert response.meaning_graph.semantic_hash
          print({
              "installed_wheel": "OK",
              "open_lexicon_records": engine.bundle.open_lexicon.record_count,
              "semantic_records": engine.semantic_data.record_count,
          })
          VERIFY_PY

      - name: Upload Direct Final runtime release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-final-runtime-github-release-${{ github.sha }}
          path: |
            dist
            reports
            dictionaries/system/compiled/open_lexicon
            dictionaries/system/compiled/canonical_dictionary_runtime
            dictionaries/system/compiled/direct_final_integration.json
            dictionaries/system/compiled/direct_final_support
          if-no-files-found: error
          retention-days: 30

name: Targeted G0148
on:
  push:

permissions:
  contents: read

jobs:
  g0148:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Regression tests
        run: |
          mkdir -p reports
          pytest -q \
            tests/test_exception_intent_regression.py \
            tests/test_reading_unknown_audit.py \
            --junitxml=reports/g0148-${{ matrix.python-version }}.xml
      - name: Gold validator
        run: |
          set -o pipefail
          python tools/validator.py | tee reports/validator-${{ matrix.python-version }}.txt
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0148-${{ matrix.python-version }}
          path: reports
          retention-days: 7

name: Targeted G0148
on:
  push:

permissions:
  contents: read

jobs:
  g0148:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Cold-start phase diagnostic
        run: |
          mkdir -p reports
          python - <<'PY' | tee reports/cold-start-${{ matrix.python-version }}.json
          import json
          import time
          from deterministic_japanese_parser_mcp import AnalyzeRequest, ParserEngine

          started = time.perf_counter()
          engine = ParserEngine()
          init_ms = round((time.perf_counter() - started) * 1000, 3)
          response = engine.analyze(AnalyzeRequest(original_text="もう帰っていい？"))
          print(json.dumps({
              "init_ms": init_ms,
              "overall_status": response.overall_status.value,
              "analysis_path": response.analysis_path,
              "propositions": [item.predicate for item in response.meaning_graph.propositions],
              "reading_status": response.meaning_graph.reading_analysis.status.value,
              "timeouts": response.timeouts,
              "metrics": response.metrics,
          }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Regression tests
        run: |
          python -m pytest -q \
            tests/test_exception_intent_regression.py \
            tests/test_reading_unknown_audit.py \
            --junitxml=reports/g0148-${{ matrix.python-version }}.xml
      - name: Gold validator
        run: |
          set -o pipefail
          python tools/validator.py | tee reports/validator-${{ matrix.python-version }}.txt
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0148-${{ matrix.python-version }}
          path: reports
          retention-days: 7

name: Development Probe

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: dev-probe-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[DEV-PROBE]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mkdir -p reports

      - name: Deployment preflight
        shell: bash
        run: |
          set -o pipefail
          python scripts/preflight.py | tee reports/preflight-${{ matrix.python-version }}.json

      - name: Runtime lexicon provenance and license validation
        shell: bash
        run: |
          set -o pipefail
          python tools/lexicon_validator.py | tee reports/lexicon-validator-${{ matrix.python-version }}.txt

      - name: Dictionary and Gold validation
        shell: bash
        run: |
          set -o pipefail
          python tools/validator.py | tee reports/validator-${{ matrix.python-version }}.txt

      - name: Supported semantic profile quality contract
        run: >-
          python scripts/semantic_quality_contract.py --check
          --output reports/semantic-quality-${{ matrix.python-version }}.json

      - name: Independent semantic holdout contract
        run: >-
          python scripts/semantic_holdout_contract.py --check
          --output reports/semantic-holdout-${{ matrix.python-version }}.json

      - name: Unit, importer, supply-chain and MCP stdio E2E tests
        run: python -m pytest --junitxml=reports/pytest-${{ matrix.python-version }}.xml

      - name: Existing benchmark regression gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/benchmark.py --check --rounds 50 | tee reports/benchmark-${{ matrix.python-version }}.json

      - name: 10ms target and 20x dictionary performance contract
        run: >-
          python scripts/performance_contract.py --check --rounds 50
          --stdio-rounds 30 --scale 20 --max-ready-ms 10
          --output reports/performance-${{ matrix.python-version }}.json

      - name: Astera call-through 10ms target and 50ms hard limit
        run: >-
          python scripts/astera_latency_contract.py --check --rounds 50
          --stdio-rounds 30 --target-ms 10 --hard-ms 50
          --output reports/astera-latency-${{ matrix.python-version }}.json

      - name: Compile source tree
        run: python -m compileall -q src tools scripts tests

      - name: Upload project verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-probe-${{ github.run_id }}-python-${{ matrix.python-version }}
          path: reports
          if-no-files-found: warn
          retention-days: 3

  close-request:
    if: >-
      always() &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[DEV-PROBE]')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Comment success and close request
        if: needs.verify.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Development Probe passed.\n\nWorkflow run: ${runUrl}\nArtifacts: dev-probe-${context.runId}-python-3.10 / dev-probe-${context.runId}-python-3.12`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Comment failure without closing request
        if: needs.verify.result != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Development Probe failed. The request remains open.\n\nWorkflow run: ${runUrl}`,
            });

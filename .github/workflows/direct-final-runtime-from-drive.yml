name: Direct Final Runtime Emergency Import From Drive

on:
  workflow_dispatch:
    inputs:
      drive-folder-id:
        description: "Emergency staging only: Drive folder containing manifest.json, final parts, and support pack"
        required: true
      artifact-name:
        description: "Artifact name for the staged Direct Final source bundle when upload-source-bundle=true"
        required: true
        default: "mcp-runtime-direct-final-v1"
      expected-records:
        description: "Expected Direct Final runtime records"
        required: true
      upload-source-bundle:
        description: "Upload the staged source bundle after explicit approval; keep false unless staging export is approved"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  emergency-import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DRIVE_FOLDER_ID: ${{ inputs['drive-folder-id'] }}
      EXPECTED_RECORDS: ${{ inputs['expected-records'] }}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install emergency import verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Download and verify staged Direct Final bundle from Drive
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          folder_id = os.environ["DRIVE_FOLDER_ID"].strip()
          expected_records = int(os.environ["EXPECTED_RECORDS"])
          if not folder_id:
              raise SystemExit("drive-folder-id workflow input is required")
          secret = os.environ.get("GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON", "").strip()
          if not secret:
              raise SystemExit(
                  "GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON secret is required. "
                  "Share the Drive folder with that service account before running."
              )

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(secret),
              scopes=["https://www.googleapis.com/auth/drive.readonly"],
          )
          credentials.refresh(Request())
          headers = {"Authorization": f"Bearer {credentials.token}"}
          root = Path("work/direct-final-drive-input")
          root.mkdir(parents=True, exist_ok=True)
          reports = Path("reports")
          reports.mkdir(exist_ok=True)

          def drive_get(url: str, **params: object) -> dict:
              response = requests.get(url, params=params, headers=headers, timeout=60)
              response.raise_for_status()
              return response.json()

          files: dict[str, dict] = {}
          page_token = None
          while True:
              params = {
                  "q": f"'{folder_id}' in parents and trashed = false",
                  "fields": "nextPageToken, files(id,name,size,mimeType)",
                  "pageSize": 1000,
                  "supportsAllDrives": "true",
                  "includeItemsFromAllDrives": "true",
              }
              if page_token:
                  params["pageToken"] = page_token
              payload = drive_get("https://www.googleapis.com/drive/v3/files", **params)
              for item in payload.get("files", []):
                  files[item["name"]] = item
              page_token = payload.get("nextPageToken")
              if not page_token:
                  break

          def download_file(name: str, *, expected_sha256: str | None = None) -> Path:
              if name not in files:
                  raise SystemExit(f"Drive file missing from folder: {name}")
              file_id = files[name]["id"]
              destination = root / name
              url = f"https://www.googleapis.com/drive/v3/files/{file_id}"
              with requests.get(
                  url,
                  params={"alt": "media", "supportsAllDrives": "true"},
                  headers=headers,
                  stream=True,
                  timeout=60,
              ) as response:
                  response.raise_for_status()
                  digest = hashlib.sha256()
                  bytes_written = 0
                  with destination.open("wb") as handle:
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if not chunk:
                              continue
                          handle.write(chunk)
                          digest.update(chunk)
                          bytes_written += len(chunk)
              declared_size = files[name].get("size")
              if declared_size is not None and bytes_written != int(declared_size):
                  raise SystemExit(
                      f"Drive size mismatch for {name}: {bytes_written} != {declared_size}"
                  )
              actual = digest.hexdigest()
              if expected_sha256 and actual != expected_sha256:
                  raise SystemExit(
                      f"Drive sha256 mismatch for {name}: {actual} != {expected_sha256}"
                  )
              return destination

          manifest_path = download_file("manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schema_version") != "djpmcp.direct-runtime-final.manifest.v1":
              raise SystemExit(f"unexpected Direct Final manifest schema: {manifest.get('schema_version')}")
          if manifest.get("target") != "Deterministic-Japanese-Parser-MCP":
              raise SystemExit(f"unexpected Direct Final target: {manifest.get('target')}")
          if manifest.get("factory_used") is not False:
              raise SystemExit("Direct Final Drive bundle must declare factory_used=false")
          final_records = int(manifest["candidate_reduction"]["final_unique_runtime_entries"])
          if final_records != expected_records:
              raise SystemExit("Direct Final record count does not match workflow input")
          validation = manifest.get("validation") or {}
          if validation.get("gzip_integrity_final_parts") != "PASS":
              raise SystemExit("Direct Final manifest does not declare gzip integrity PASS")
          if int(validation.get("missing_required_core_fields", -1)) != 0:
              raise SystemExit("Direct Final manifest declares missing required core fields")
          if len(manifest.get("parts") or []) != int(validation.get("final_part_count", -1)):
              raise SystemExit("Direct Final manifest part count mismatch")

          for part in manifest["parts"]:
              download_file(part["file"], expected_sha256=part["sha256"])
          support = manifest.get("support_pack") or {}
          if support.get("file"):
              download_file(support["file"], expected_sha256=support.get("sha256"))

          report = {
              "status": "DIRECT_FINAL_DRIVE_STAGING_BUNDLE_MATERIALIZED",
              "expected_runtime_records_matched": True,
              "factory_used": manifest.get("factory_used"),
              "target": manifest.get("target"),
          }
          (reports / "direct-final-drive-materialization.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Upload staged Direct Final source bundle
        if: ${{ inputs['upload-source-bundle'] == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs['artifact-name'] }}
          path: work/direct-final-drive-input
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload emergency import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-final-drive-emergency-import-report-${{ github.sha }}
          path: reports
          if-no-files-found: warn
          retention-days: 30

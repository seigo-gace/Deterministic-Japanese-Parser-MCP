name: Targeted TGserver Logging

on:
  push:
    branches:
      - feat/tgserver-async-log-sink-20260926
  pull_request:
    paths:
      - "src/deterministic_japanese_parser_mcp/logger.py"
      - "tests/test_tgserver_logger.py"
      - ".env.example"
      - "docs/PRODUCTION_HTTP_DEPLOYMENT.md"

permissions:
  contents: read

jobs:
  tgserver-log-sink:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: TGserver logger contract
        run: pytest -q tests/test_tgserver_logger.py
      - name: Semantic regression guard
        run: pytest -q tests/test_meaning_graph.py tests/test_reading_unknown_audit.py
      - name: Compile
        run: python -m compileall -q src tests

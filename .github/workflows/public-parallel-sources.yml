name: Public Parallel Source Acquisition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/public_parallel_sources.json"
      - "tools/public_parallel_sources.py"
      - "tools/public_parallel_xml_runner.py"
      - ".github/workflows/public-parallel-sources.yml"

permissions:
  contents: read

jobs:
  normalize-parallel-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install legacy XLS reader
        run: pip install xlrd==2.0.2
      - name: Validate normalizer and XML repair runner syntax
        run: |
          python -m py_compile tools/public_parallel_sources.py
          python -m py_compile tools/public_parallel_xml_runner.py
      - name: Acquire official NICT parallel resources
        run: |
          mkdir -p work/public-parallel-sources/raw work/public-parallel-sources/sample work/public-parallel-sources/normalized reports
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --output work/public-parallel-sources/raw/JEC_basic_sentence_v1-2.xls \
            https://alaginrc.nict.go.jp/jecbs/src/JEC_basic_sentence_v1-2.xls
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --output work/public-parallel-sources/raw/wiki_corpus_2.01.tar.gz \
            https://alaginrc.nict.go.jp/WikiCorpus/src/wiki_corpus_2.01.tar.gz
      - name: Inspect real workbook and archive structures
        run: |
          python tools/public_parallel_sources.py inspect-jecbs \
            --source work/public-parallel-sources/raw/JEC_basic_sentence_v1-2.xls \
            --report reports/jecbs-source-inspection.json
          python tools/public_parallel_sources.py inspect-kyoto \
            --source work/public-parallel-sources/raw/wiki_corpus_2.01.tar.gz \
            --report reports/kyoto-source-inspection.json \
            --sample work/public-parallel-sources/sample/kyoto-first.xml
      - name: Verify pinned source structures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path('reports/jecbs-source-inspection.json').read_text(encoding='utf-8'))
          k = json.loads(Path('reports/kyoto-source-inspection.json').read_text(encoding='utf-8'))
          if j.get('source_sha256') != 'e3a40c8e80ce002e1fab10ccd20ace8760dd200731a27994fe54a1016b2aeafe':
              raise SystemExit(f"JECBS_SOURCE_CHANGED:{j.get('source_sha256')}")
          sheets = j.get('workbook_sheets') or []
          if len(sheets) != 1 or sheets[0].get('name') != 'ALL_NEW' or sheets[0].get('rows') != 5304 or sheets[0].get('columns') != 4:
              raise SystemExit(f"JECBS_STRUCTURE_CHANGED:{sheets}")
          if k.get('source_sha256') != '456172bdd1d7a32dbe68ae3e55e0a6de25a4f40582636fd7712a5404319a10e5':
              raise SystemExit(f"KYOTO_SOURCE_CHANGED:{k.get('source_sha256')}")
          if k.get('xml_members') != 14111 or k.get('glossary_candidates') != ['kyoto_lexicon.csv']:
              raise SystemExit(f"KYOTO_STRUCTURE_CHANGED:{k}")
          print({'jecbs_rows': 5304, 'kyoto_articles': 14111, 'kyoto_glossary': 'kyoto_lexicon.csv'})
          PY
      - name: Normalize all source records with auditable in-memory XML repair
        run: |
          python tools/public_parallel_xml_runner.py normalize-all \
            --manifest config/public_parallel_sources.json \
            --jecbs-source work/public-parallel-sources/raw/JEC_basic_sentence_v1-2.xls \
            --kyoto-source work/public-parallel-sources/raw/wiki_corpus_2.01.tar.gz \
            --output-root work/public-parallel-sources/normalized \
            --report reports/public-parallel-sources-report.json \
            --lock reports/public-parallel-sources-lock.json
      - name: Verify full normalization, repair evidence, and semantic boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/public-parallel-sources-report.json').read_text(encoding='utf-8'))
          repairs = json.loads(Path('reports/public-parallel-xml-repairs.json').read_text(encoding='utf-8'))
          if report.get('status') != 'NORMALIZED':
              raise SystemExit('PARALLEL_NORMALIZATION_NOT_COMPLETE')
          j = report['jecbs']; k = report['kyoto']
          if j.get('records') != 5304 or j.get('malformed_records') != 0:
              raise SystemExit(f"JECBS_RECORD_LOSS:{j}")
          if k.get('articles') != 14111:
              raise SystemExit(f"KYOTO_ARTICLE_LOSS:{k.get('articles')}")
          if int(k.get('translation_units', 0)) < 400000:
              raise SystemExit(f"KYOTO_TRANSLATION_UNIT_COUNT_SUSPICIOUS:{k.get('translation_units')}")
          if k.get('missing_translation_units') != 0:
              raise SystemExit(f"KYOTO_TRANSLATION_MISSING:{k.get('missing_translation_units')}")
          if int(k.get('glossary_rows', 0)) < 40000:
              raise SystemExit(f"KYOTO_GLOSSARY_COUNT_SUSPICIOUS:{k.get('glossary_rows')}")
          if repairs.get('failed_repairs') != 0 or repairs.get('source_archive_modified') is not False:
              raise SystemExit(f"PARALLEL_XML_REPAIR_BOUNDARY_FAILURE:{repairs}")
          for item in repairs.get('repairs') or []:
              if item.get('repair_status') != 'REPAIRED_IN_MEMORY':
                  raise SystemExit(f"PARALLEL_XML_REPAIR_STATUS_INVALID:{item}")
              if len(str(item.get('source_payload_sha256') or '')) != 64 or len(str(item.get('repaired_payload_sha256') or '')) != 64:
                  raise SystemExit(f"PARALLEL_XML_REPAIR_DIGEST_MISSING:{item}")
              if not item.get('archive_member') or not item.get('replacements'):
                  raise SystemExit(f"PARALLEL_XML_REPAIR_EVIDENCE_MISSING:{item}")
          if report.get('definition_fabricated') is not False:
              raise SystemExit('PARALLEL_DEFINITION_FABRICATION')
          if report.get('llm_api_used') is not False or report.get('web_scraping_used') is not False:
              raise SystemExit('PARALLEL_BOUNDARY_VIOLATION')
          for source in (j, k):
              if len(str(source.get('source_sha256') or '')) != 64:
                  raise SystemExit(f"PARALLEL_SOURCE_DIGEST_MISSING:{source.get('source_id')}")
          print({
              'jecbs_records': j['records'],
              'kyoto_articles': k['articles'],
              'kyoto_translation_units': k['translation_units'],
              'kyoto_sentence_units': k['sentence_units'],
              'kyoto_final_checked_units': k['final_checked_units'],
              'kyoto_glossary_rows': k['glossary_rows'],
              'kyoto_glossary_pairs': k['glossary_bilingual_pair_rows'],
              'kyoto_unknown_elements': k['unknown_elements'],
              'xml_repair_count': repairs.get('repair_count'),
              'xml_repairs': repairs.get('repairs'),
          })
          PY
          rm -rf work/public-parallel-sources/raw
      - name: Upload normalized parallel evidence packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-parallel-sources-${{ github.sha }}
          path: |
            work/public-parallel-sources/normalized/**/*.jsonl
            work/public-parallel-sources/sample/kyoto-first.xml
            reports/jecbs-source-inspection.json
            reports/kyoto-source-inspection.json
            reports/public-parallel-sources-report.json
            reports/public-parallel-sources-lock.json
            reports/public-parallel-xml-repairs.json
          if-no-files-found: warn
          retention-days: 30

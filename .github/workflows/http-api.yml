name: HTTP API Gate

on:
  push:
    branches: ["feat/http-api-20260924"]
    paths:
      - "src/deterministic_japanese_parser_mcp/http_server.py"
      - "tests/test_http_api.py"
      - "Dockerfile.http"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/http-api.yml"
  pull_request:
    paths:
      - "src/deterministic_japanese_parser_mcp/http_server.py"
      - "tests/test_http_api.py"
      - "Dockerfile.http"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/http-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: HTTP API unit and MCP Streamable HTTP tests
        run: pytest -q tests/test_http_api.py
      - name: Build dedicated HTTP image
        run: docker build -f Dockerfile.http -t djpmcp-http-ci .
      - name: Container localhost smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name djpmcp-http-ci \
            -p 127.0.0.1:18765:8765 \
            -e DJPMCP_HTTP_API_KEY=ci-only-key \
            -e DJPMCP_HTTP_ALLOWED_HOSTS=127.0.0.1:18765 \
            djpmcp-http-ci
          trap 'docker rm -f djpmcp-http-ci >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18765/readyz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18765/healthz
          curl -fsS http://127.0.0.1:18765/readyz

          code="$(curl -sS -o /tmp/unauth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"original_text":"API疎通確認"}' \
            http://127.0.0.1:18765/v1/analyze)"
          test "$code" = "401"

          curl -fsS \
            -H 'Authorization: Bearer ci-only-key' \
            -H 'Content-Type: application/json' \
            --data '{"original_text":"API疎通確認"}' \
            http://127.0.0.1:18765/v1/analyze \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["original_text"]=="API疎通確認"; assert "meaning_graph" in d; assert "task_graph" in d'

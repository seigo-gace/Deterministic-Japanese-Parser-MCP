name: J-Ono Review Preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-j-ono-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: source-authored-meaning-data-v1
      EXPECTED_J_ONO_RECORDS: "837"
      RAW_SHA256: fecb5469bfd792ac0144587287dd04b29bad73f61abb6abd913ccb437f2ac629
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install review preparation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download frozen raw factory input parts
        run: |
          mkdir -p work/raw-parts work/raw-unpacked work/rebuilt
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "mcp-collected-raw-factory-input-v1.zip.part-*" \
            --dir work/raw-parts
          test -f work/raw-parts/mcp-collected-raw-factory-input-v1.zip.part-00
          test -f work/raw-parts/mcp-collected-raw-factory-input-v1.zip.part-01
          test -f work/raw-parts/mcp-collected-raw-factory-input-v1.zip.part-02

      - name: Reconstruct and verify frozen raw package
        run: |
          cat \
            work/raw-parts/mcp-collected-raw-factory-input-v1.zip.part-00 \
            work/raw-parts/mcp-collected-raw-factory-input-v1.zip.part-01 \
            work/raw-parts/mcp-collected-raw-factory-input-v1.zip.part-02 \
            > work/mcp-collected-raw-factory-input-v1.zip
          echo "$RAW_SHA256  work/mcp-collected-raw-factory-input-v1.zip" | sha256sum -c -
          unzip -q work/mcp-collected-raw-factory-input-v1.zip -d work/raw-unpacked

      - name: Locate frozen bundle and rebuild source-authored meaning factory
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("work/raw-unpacked")
          bundles = sorted(root.rglob("mcp-collected-raw-factory-input-v1.tar"))
          manifests = sorted(root.rglob("mcp-collected-raw-factory-input-v1.manifest.json"))
          if len(bundles) != 1 or len(manifests) != 1:
              raise SystemExit(
                  f"FROZEN_INPUT_LAYOUT_INVALID:bundles={len(bundles)}:manifests={len(manifests)}"
              )
          Path("work/bundle-path.txt").write_text(str(bundles[0]), encoding="utf-8")
          Path("work/manifest-path.txt").write_text(str(manifests[0]), encoding="utf-8")
          PY
          python tools/build_frozen_raw_meaning_factory.py \
            --bundle "$(cat work/bundle-path.txt)" \
            --manifest "$(cat work/manifest-path.txt)" \
            --output-root work/rebuilt

      - name: Extract rebuilt J-Ono records with preserved reading provenance
        run: |
          python tools/prepare_j_ono_review_input.py \
            --adapter-input work/rebuilt/source-adapter-records.jsonl \
            --output work/j-ono-source-adapter.jsonl

      - name: Audit rebuilt J-Ono review input
        run: |
          python tools/audit_j_ono_data_quality.py \
            --input work/j-ono-source-adapter.jsonl \
            --report work/j-ono-review-input-quality.json \
            --issues work/j-ono-review-input-issues.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/j-ono-review-input-quality.json").read_text(encoding="utf-8"))
          if report["record_count"] != 837:
              raise SystemExit("J_ONO_REVIEW_INPUT_COUNT_MISMATCH")
          if report["reading_coverage_records"] != 837:
              raise SystemExit("J_ONO_REVIEW_INPUT_READING_NOT_COMPLETE")
          if report["hard_failure_count"] != 0:
              raise SystemExit("J_ONO_REVIEW_INPUT_HARD_FAILURE")
          if report["automatic_meaning_judgement"] is not False:
              raise SystemExit("J_ONO_REVIEW_INPUT_AUTO_MEANING_FORBIDDEN")
          if report["automatic_approval"] is not False:
              raise SystemExit("J_ONO_REVIEW_INPUT_AUTO_APPROVAL_FORBIDDEN")
          if report["runtime_promotion"] is not False:
              raise SystemExit("J_ONO_REVIEW_INPUT_RUNTIME_PROMOTION_FORBIDDEN")
          PY

      - name: Compile existing universal source-adapter contract
        run: |
          python tools/unified_semantic_data/source_adapter_contract.py \
            work/j-ono-source-adapter.jsonl \
            --output-root work/j-ono-adapter

      - name: Prepare existing Review and Decision Ledger lane
        run: |
          mkdir -p \
            work/empty-open \
            work/empty-context \
            work/empty-pack \
            work/empty-semantic-reference \
            work/empty-canonical-evidence \
            work/empty-decisions
          python tools/unified_semantic_data_pipeline.py \
            --open-lexicon-root work/empty-open \
            --context-root work/empty-context \
            --pack-root work/empty-pack \
            --semantic-reference-root work/empty-semantic-reference \
            --canonical-evidence-root work/empty-canonical-evidence \
            --adapter-output-root work/j-ono-adapter \
            --decision-root work/empty-decisions \
            --output-root work/j-ono-review \
            --force-rebuild

      - name: Verify review-only boundary and exact record conservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = 837
          adapter = json.loads(Path("work/j-ono-adapter/manifest.json").read_text(encoding="utf-8"))
          review = json.loads(Path("work/j-ono-review/manifest.json").read_text(encoding="utf-8"))
          bulk = json.loads(Path("work/j-ono-review/bulk-review/bulk_review_manifest.json").read_text(encoding="utf-8"))
          approved = Path("work/j-ono-review/approved-records.jsonl").read_text(encoding="utf-8")
          queue = [
              json.loads(line)
              for line in Path("work/j-ono-review/review-queue.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          if adapter["adapter_record_count"] != expected:
              raise SystemExit("J_ONO_ADAPTER_COUNT_MISMATCH")
          if adapter["semantic_reference_record_count"] != expected:
              raise SystemExit("J_ONO_SEMANTIC_REFERENCE_COUNT_MISMATCH")
          if adapter["lexical_candidate_record_count"] != expected:
              raise SystemExit("J_ONO_LEXICAL_CANDIDATE_COUNT_MISMATCH")
          if review["total_records"] != expected or review["review_queue_records"] != expected:
              raise SystemExit("J_ONO_REVIEW_QUEUE_COUNT_MISMATCH")
          if review["runtime_eligible_records"] != 0:
              raise SystemExit("J_ONO_PREMATURE_RUNTIME_ELIGIBILITY")
          if review["decision_count"] != 0 or approved.strip():
              raise SystemExit("J_ONO_PREMATURE_APPROVAL")
          if review["boundaries"]["automatic_approval"] is not False:
              raise SystemExit("J_ONO_AUTOMATIC_APPROVAL_BOUNDARY_BROKEN")
          if review["boundaries"]["automatic_runtime_promotion"] is not False:
              raise SystemExit("J_ONO_RUNTIME_PROMOTION_BOUNDARY_BROKEN")
          if bulk["total_records"] != expected:
              raise SystemExit("J_ONO_BULK_REVIEW_COUNT_MISMATCH")
          if bulk["network_call_performed"] is not False:
              raise SystemExit("J_ONO_REVIEW_NETWORK_CALL_OCCURRED")
          if bulk["runtime_promotion_allowed"] is not False:
              raise SystemExit("J_ONO_REVIEW_RUNTIME_PROMOTION_ALLOWED")
          if len({row["record_id"] for row in queue}) != expected:
              raise SystemExit("J_ONO_REVIEW_ID_CONSERVATION_MISMATCH")

          lexical_review_records = 0
          blocker_counts = {}
          for row in queue:
              approval = row.get("approval") or {}
              review_scopes = set(approval.get("review_scopes") or [])
              blockers_by_scope = approval.get("blockers_by_scope") or {}
              if "lexical" in review_scopes:
                  lexical_review_records += 1
              for blocker in blockers_by_scope.get("lexical") or []:
                  blocker_counts[blocker] = blocker_counts.get(blocker, 0) + 1
          if blocker_counts.get("reading-required", 0) != 0:
              raise SystemExit("J_ONO_REVIEW_READING_BLOCKER_REMAINED")

          report = {
              "status": "J_ONO_REVIEW_PREPARATION_PASS",
              "records": expected,
              "review_queue_records": len(queue),
              "approved_records": 0,
              "reading_coverage_records": 837,
              "lexical_review_records": lexical_review_records,
              "lexical_blocker_counts": dict(sorted(blocker_counts.items())),
              "part_of_speech_required_records": blocker_counts.get("part-of-speech-required", 0),
              "automatic_approval": False,
              "runtime_promotion": False,
              "network_call_performed": False,
              "bulk_review_job_id": review["bulk_review_job_id"],
          }
          Path("work/j-ono-review-preparation-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload J-Ono review preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: j-ono-review-preparation-${{ github.sha }}
          path: |
            work/j-ono-source-adapter.jsonl
            work/j-ono-review-input-quality.json
            work/j-ono-review-input-issues.jsonl
            work/j-ono-adapter
            work/j-ono-review
            work/j-ono-review-preparation-report.json
          if-no-files-found: error
          retention-days: 30

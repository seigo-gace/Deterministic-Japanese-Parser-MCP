name: J-Ono Review Preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-j-ono-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: source-authored-meaning-data-v1
      EXPECTED_J_ONO_RECORDS: "837"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install review preparation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download source-authored meaning factory from GitHub Release
        run: |
          mkdir -p work/source-authored-meaning-release
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "mcp-source-authored-meaning-factory-v1.zip" \
            --dir work/source-authored-meaning-release
          test -f work/source-authored-meaning-release/mcp-source-authored-meaning-factory-v1.zip

      - name: Extract exact J-Ono source-authored adapter records
        run: |
          python tools/prepare_j_ono_review_input.py \
            --factory-zip work/source-authored-meaning-release/mcp-source-authored-meaning-factory-v1.zip \
            --output work/j-ono-source-adapter.jsonl

      - name: Compile existing universal source-adapter contract
        run: |
          python tools/unified_semantic_data/source_adapter_contract.py \
            work/j-ono-source-adapter.jsonl \
            --output-root work/j-ono-adapter

      - name: Prepare existing Review and Decision Ledger lane
        run: |
          mkdir -p \
            work/empty-open \
            work/empty-context \
            work/empty-pack \
            work/empty-semantic-reference \
            work/empty-canonical-evidence \
            work/empty-decisions
          python tools/unified_semantic_data_pipeline.py \
            --open-lexicon-root work/empty-open \
            --context-root work/empty-context \
            --pack-root work/empty-pack \
            --semantic-reference-root work/empty-semantic-reference \
            --canonical-evidence-root work/empty-canonical-evidence \
            --adapter-output-root work/j-ono-adapter \
            --decision-root work/empty-decisions \
            --output-root work/j-ono-review \
            --force-rebuild

      - name: Verify review-only boundary and exact record conservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = 837
          adapter = json.loads(Path("work/j-ono-adapter/manifest.json").read_text(encoding="utf-8"))
          review = json.loads(Path("work/j-ono-review/manifest.json").read_text(encoding="utf-8"))
          bulk = json.loads(Path("work/j-ono-review/bulk-review/bulk_review_manifest.json").read_text(encoding="utf-8"))
          approved = Path("work/j-ono-review/approved-records.jsonl").read_text(encoding="utf-8")
          queue = [
              json.loads(line)
              for line in Path("work/j-ono-review/review-queue.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          if adapter["adapter_record_count"] != expected:
              raise SystemExit("J_ONO_ADAPTER_COUNT_MISMATCH")
          if adapter["semantic_reference_record_count"] != expected:
              raise SystemExit("J_ONO_SEMANTIC_REFERENCE_COUNT_MISMATCH")
          if adapter["lexical_candidate_record_count"] != expected:
              raise SystemExit("J_ONO_LEXICAL_CANDIDATE_COUNT_MISMATCH")
          if review["total_records"] != expected or review["review_queue_records"] != expected:
              raise SystemExit("J_ONO_REVIEW_QUEUE_COUNT_MISMATCH")
          if review["runtime_eligible_records"] != 0:
              raise SystemExit("J_ONO_PREMATURE_RUNTIME_ELIGIBILITY")
          if review["decision_count"] != 0 or approved.strip():
              raise SystemExit("J_ONO_PREMATURE_APPROVAL")
          if review["boundaries"]["automatic_approval"] is not False:
              raise SystemExit("J_ONO_AUTOMATIC_APPROVAL_BOUNDARY_BROKEN")
          if review["boundaries"]["automatic_runtime_promotion"] is not False:
              raise SystemExit("J_ONO_RUNTIME_PROMOTION_BOUNDARY_BROKEN")
          if bulk["total_records"] != expected:
              raise SystemExit("J_ONO_BULK_REVIEW_COUNT_MISMATCH")
          if bulk["network_call_performed"] is not False:
              raise SystemExit("J_ONO_REVIEW_NETWORK_CALL_OCCURRED")
          if bulk["runtime_promotion_allowed"] is not False:
              raise SystemExit("J_ONO_REVIEW_RUNTIME_PROMOTION_ALLOWED")
          if len({row["record_id"] for row in queue}) != expected:
              raise SystemExit("J_ONO_REVIEW_ID_CONSERVATION_MISMATCH")

          report = {
              "status": "J_ONO_REVIEW_PREPARATION_PASS",
              "records": expected,
              "review_queue_records": len(queue),
              "approved_records": 0,
              "automatic_approval": False,
              "runtime_promotion": False,
              "network_call_performed": False,
              "bulk_review_job_id": review["bulk_review_job_id"],
          }
          Path("work/j-ono-review-preparation-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload J-Ono review preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: j-ono-review-preparation-${{ github.sha }}
          path: |
            work/j-ono-source-adapter.jsonl
            work/j-ono-adapter
            work/j-ono-review
            work/j-ono-review-preparation-report.json
          if-no-files-found: error
          retention-days: 30

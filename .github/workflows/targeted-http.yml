name: Targeted HTTP Guard
on:
  push:

permissions:
  contents: read

jobs:
  http-guard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_http_api.py
      - run: python -m compileall -q src/deterministic_japanese_parser_mcp/http_server.py tests/test_http_api.py

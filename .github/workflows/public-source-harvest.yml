name: Frozen Raw Factory Input

on:
  pull_request:
    paths:
      - "config/frozen_raw_factory_input.json"
      - "config/source_payload_profiles.json"
      - "schemas/source_intake_manifest.schema.json"
      - "tools/build_frozen_raw_factory_input.py"
      - "tools/build_frozen_raw_meaning_factory.py"
      - "tools/unified_semantic_data/raw_intake.py"
      - "tools/unified_semantic_data/collection_intake.py"
      - "tools/unified_semantic_data/frozen_raw_meaning_factory.py"
      - "tools/unified_semantic_data/semantic_labeler.py"
      - "tools/unified_semantic_data/source_adapter_contract.py"
      - "tests/test_raw_intake.py"
      - "tests/test_frozen_raw_meaning_factory.py"
      - "tests/test_source_adapter_contract.py"
      - ".github/workflows/public-source-harvest.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: frozen-raw-factory-input-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frozen-raw-input:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      CONFIG_PATH: config/frozen_raw_factory_input.json
      PROFILES_PATH: config/source_payload_profiles.json
      WORK_ROOT: work/frozen-raw-input
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate frozen-input builder
        run: |
          python -m pip install "pytest>=8.3,<10"
          python -m py_compile tools/build_frozen_raw_factory_input.py
          python -m py_compile tools/unified_semantic_data/raw_intake.py
          python -m py_compile tools/unified_semantic_data/collection_intake.py
          python -m py_compile tools/build_frozen_raw_meaning_factory.py
          python -m py_compile tools/unified_semantic_data/frozen_raw_meaning_factory.py
          python -m py_compile tools/unified_semantic_data/source_adapter_contract.py
          python tools/build_frozen_raw_factory_input.py self-test
          python tools/build_frozen_raw_factory_input.py validate-config \
            --config "$CONFIG_PATH"
          python -m pytest \
            tests/test_raw_intake.py \
            tests/test_frozen_raw_meaning_factory.py \
            tests/test_source_adapter_contract.py

      - name: Select and download already-collected GitHub artifacts
        run: |
          python - <<'PY'
          from __future__ import annotations

          from datetime import datetime
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.error
          import urllib.request

          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          repository = config["repository"]
          branch = config["branch"]
          freeze_at = datetime.fromisoformat(config["freeze_at"].replace("Z", "+00:00"))
          token = os.environ["GH_TOKEN"]
          work = Path(os.environ["WORK_ROOT"])
          downloads = work / "downloads"
          downloads.mkdir(parents=True, exist_ok=True)

          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "deterministic-japanese-parser-mcp-frozen-raw-input",
          }

          def get_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def download(url: str, destination: Path) -> None:
              class NoCrossHostAuthorizationRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None

              request = urllib.request.Request(url, headers=headers)
              opener = urllib.request.build_opener(NoCrossHostAuthorizationRedirect)
              try:
                  response = opener.open(request, timeout=300)
              except urllib.error.HTTPError as exc:
                  if exc.code not in {301, 302, 303, 307, 308}:
                      raise
                  location = exc.headers.get("Location")
                  exc.close()
                  if not location:
                      raise RuntimeError("artifact download redirect omitted Location")
                  redirected = urllib.request.Request(
                      location,
                      headers={"User-Agent": headers["User-Agent"]},
                  )
                  response = urllib.request.urlopen(redirected, timeout=300)
              with response:
                  with destination.open("wb") as handle:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          handle.write(chunk)

          selected_runs: list[dict] = []
          selected_artifacts: list[dict] = []

          for source in config["workflow_sources"]:
              workflow_id = int(source["workflow_id"])
              if source["selection"] == "pinned_runs":
                  run_ids = [int(value) for value in source["run_ids"]]
              else:
                  query = urllib.parse.urlencode(
                      {
                          "branch": branch,
                          "status": "success",
                          "per_page": 100,
                      }
                  )
                  payload = get_json(
                      f"{api_root}/actions/workflows/{workflow_id}/runs?{query}"
                  )
                  candidates = []
                  for run in payload.get("workflow_runs", []):
                      created = datetime.fromisoformat(
                          run["created_at"].replace("Z", "+00:00")
                      )
                      if created <= freeze_at:
                          candidates.append(run)
                  if not candidates:
                      selected_runs.append(
                          {
                              "workflow_id": workflow_id,
                              "workflow_name": source["name"],
                              "status": "NO_SUCCESSFUL_RUN_BEFORE_FREEZE",
                          }
                      )
                      continue
                  candidates.sort(key=lambda row: row["created_at"], reverse=True)
                  run_ids = [int(candidates[0]["id"])]

              for run_id in run_ids:
                  artifact_payload = get_json(
                      f"{api_root}/actions/runs/{run_id}/artifacts?per_page=100"
                  )
                  selected_runs.append(
                      {
                          "workflow_id": workflow_id,
                          "workflow_name": source["name"],
                          "run_id": run_id,
                          "artifact_count": len(artifact_payload.get("artifacts", [])),
                      }
                  )
                  for artifact in artifact_payload.get("artifacts", []):
                      if artifact.get("expired"):
                          continue
                      selected_artifacts.append(
                          {
                              "id": int(artifact["id"]),
                              "name": artifact["name"],
                              "size_in_bytes": int(artifact.get("size_in_bytes") or 0),
                              "digest": artifact.get("digest"),
                              "created_at": artifact.get("created_at"),
                              "expires_at": artifact.get("expires_at"),
                              "workflow_id": workflow_id,
                              "workflow_name": source["name"],
                              "workflow_run_id": run_id,
                          }
                      )

          by_digest: dict[str, dict] = {}
          by_id: dict[int, dict] = {}
          for artifact in selected_artifacts:
              digest = str(artifact.get("digest") or "")
              if digest:
                  current = by_digest.get(digest)
                  if current is None or int(artifact["id"]) > int(current["id"]):
                      by_digest[digest] = artifact
              else:
                  by_id[int(artifact["id"])] = artifact
          artifacts = [*by_digest.values(), *by_id.values()]
          artifacts.sort(key=lambda row: (row["workflow_name"], row["name"], row["id"]))

          if not artifacts:
              raise SystemExit("NO_COLLECTED_ARTIFACTS_BEFORE_FREEZE")

          selected_path = work / "selected-artifacts.json"
          selected_path.write_text(
              json.dumps(
                  {
                      "schema_version": "1.0.0",
                      "freeze_at": config["freeze_at"],
                      "selected_runs": selected_runs,
                      "artifacts": artifacts,
                  },
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          for artifact in artifacts:
              artifact_id = int(artifact["id"])
              destination = downloads / f"{artifact_id}.zip"
              download(
                  f"{api_root}/actions/artifacts/{artifact_id}/zip",
                  destination,
              )

          print(
              json.dumps(
                  {
                      "selected_artifacts": len(artifacts),
                      "selected_runs": len(selected_runs),
                      "download_bytes": sum(
                          path.stat().st_size for path in downloads.glob("*.zip")
                      ),
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Build one frozen raw factory-input file
        run: |
          mkdir -p "$WORK_ROOT/output"
          python tools/build_frozen_raw_factory_input.py build \
            --config "$CONFIG_PATH" \
            --selected-artifacts "$WORK_ROOT/selected-artifacts.json" \
            --downloads-root "$WORK_ROOT/downloads" \
            --output "$WORK_ROOT/output/mcp-collected-raw-factory-input-v1.tar" \
            --manifest "$WORK_ROOT/output/mcp-collected-raw-factory-input-v1.manifest.json" \
            --profiles "$PROFILES_PATH"

      - name: Prove bundle contains unchanged artifact ZIP bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import tarfile

          root = Path("work/frozen-raw-input")
          manifest = json.loads(
              (root / "output/mcp-collected-raw-factory-input-v1.manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          with tarfile.open(
              root / "output/mcp-collected-raw-factory-input-v1.tar", "r"
          ) as archive:
              for artifact in manifest["artifacts"]:
                  member = archive.getmember(artifact["bundle_path"])
                  data = archive.extractfile(member).read()
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != artifact["downloaded_zip_sha256"]:
                      raise SystemExit(
                          f"RAW_ARTIFACT_CHANGED:{artifact['id']}:{artifact['name']}"
                      )
          print(
              json.dumps(
                  {
                      "status": "ALL_67_INPUTS_66_LOGICAL_SOURCES_FACTORY_READY",
                      "artifact_count": manifest["artifact_count"],
                      "source_count": manifest["source_count"],
                      "factory_ready_source_count": manifest["factory_ready_source_count"],
                      "rights_lane_counts": manifest["rights_lane_counts"],
                      "parser_family_counts": manifest["parser_family_counts"],
                      "bundle_sha256": manifest["bundle_sha256"],
                      "bundle_bytes": manifest["bundle_bytes"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Upload the single factory-input data file
        uses: actions/upload-artifact@v4
        with:
          name: mcp-collected-raw-factory-input-v1
          path: |
            work/frozen-raw-input/output/mcp-collected-raw-factory-input-v1.tar
            work/frozen-raw-input/output/mcp-collected-raw-factory-input-v1.manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Build source-authored meaning adapter lanes
        run: |
          python tools/build_frozen_raw_meaning_factory.py \
            --bundle "$WORK_ROOT/output/mcp-collected-raw-factory-input-v1.tar" \
            --manifest "$WORK_ROOT/output/mcp-collected-raw-factory-input-v1.manifest.json" \
            --output-root "$WORK_ROOT/meaning-factory"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("work/frozen-raw-input/meaning-factory/meaning-factory-report.json")
              .read_text(encoding="utf-8")
          )
          if report["lexical_definition_source_count"] != 7:
              raise SystemExit(
                  "unexpected lexical-definition source count: "
                  f"{report['lexical_definition_source_count']}"
              )
          if report["adapter_record_count"] < 1 or report["unresolved_record_count"] != 0:
              raise SystemExit(f"meaning factory incomplete: {report}")
          boundaries = report["boundaries"]
          required = {
              "all_declared_lexical_definition_sources_processed": True,
              "source_authored_meanings_only": True,
              "automatic_approval": False,
              "automatic_runtime_promotion": False,
              "decision_ledger_required": True,
          }
          for key, expected in required.items():
              if boundaries.get(key) is not expected:
                  raise SystemExit(
                      f"meaning factory boundary mismatch: {key}={boundaries.get(key)!r}"
                  )
          print(json.dumps({
              "status": "SOURCE_AUTHORED_MEANING_ADAPTER_READY",
              "lexical_definition_sources": report["lexical_definition_source_count"],
              "adapter_records": report["adapter_record_count"],
              "semantic_references": report["adapter_contract"]["semantic_reference_record_count"],
              "lexical_candidates": report["adapter_contract"]["lexical_candidate_record_count"],
              "unresolved_records": report["unresolved_record_count"],
          }, sort_keys=True))
          PY

      - name: Restore immutable 125000-record review queue
        uses: actions/download-artifact@v4
        with:
          name: unified-data-supply-processing-evidence
          repository: seigo-gace/Deterministic-Japanese-Parser-MCP
          run-id: 31030553984
          github-token: ${{ github.token }}
          path: ${{ env.WORK_ROOT }}/review-seed

      - name: Attach collected source meanings to review candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("tools").resolve()))
          from unified_semantic_data.semantic_labeler import (
              build_semantic_enrichment_queue,
          )

          root = Path("work/frozen-raw-input")
          queue = root / "review-seed/unified-semantic-data/review-queue.jsonl"
          if not queue.is_file():
              raise SystemExit(f"immutable review queue missing: {queue}")
          report = build_semantic_enrichment_queue(
              queue,
              root / "meaning-enrichment",
              reference_roots=[
                  Path("tools/unified_semantic_data/reference"),
                  root / "meaning-factory/adapter-output/semantic-reference.jsonl",
              ],
          )
          if report["total_records"] != 125000:
              raise SystemExit(
                  f"review queue count mismatch: {report['total_records']}"
              )
          proposed = int(report.get("proposed_from_reference_packs", 0))
          if proposed < 1:
              raise SystemExit(
                  "collected source meanings did not attach to any review candidate"
              )
          print(json.dumps({
              "status": "SOURCE_MEANING_CANDIDATES_ATTACHED",
              "total_records": report["total_records"],
              "meaning_missing_records": report.get("meaning_missing_records", 0),
              "proposed_from_approved_records": report.get("proposed_from_approved_records", 0),
              "proposed_from_reference_packs": proposed,
              "unresolved_meaning_records": report.get("unresolved_meaning_records", 0),
              "enrichment_queue_records": report.get("enrichment_queue_records", 0),
              "automatic_approval": False,
          }, sort_keys=True))
          PY

      - name: Upload source-authored meaning factory output
        uses: actions/upload-artifact@v4
        with:
          name: mcp-source-authored-meaning-factory-v1
          path: |
            work/frozen-raw-input/meaning-factory/adapter-output/
            work/frozen-raw-input/meaning-factory/meaning-factory-report.json
            work/frozen-raw-input/meaning-factory/unresolved-meaning-records.jsonl
            work/frozen-raw-input/meaning-enrichment/semantic-enrichment-report.json
            work/frozen-raw-input/meaning-enrichment/semantic-enrichment-queue.jsonl
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

[build-system]
requires = ["setuptools>=68", "wheel", "PyYAML>=6.0.3,<7"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-japanese-parser-mcp"
version = "0.4.0"
description = "Non-AI deterministic Japanese Meaning Graph and action-safety MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "seigo-gace"}]
dependencies = [
  "mcp>=1.28.1,<2",
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0.3,<7",
  "regex>=2026.7.19,<2027",
  "sudachipy==0.6.11",
  "sudachidict-core==20260428",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<7"]

[project.scripts]
djpmcp = "deterministic_japanese_parser_mcp.server:main"
djpmcp-validate = "deterministic_japanese_parser_mcp.cli:validate_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/deterministic-japanese-parser-mcp/dictionaries/system" = [
  "dictionaries/system/synonyms.yaml",
  "dictionaries/system/task_templates.yaml",
  "dictionaries/system/semantic_profiles.yaml",
]
"share/deterministic-japanese-parser-mcp/dictionaries/system/metaphors" = ["dictionaries/system/metaphors/*.json"]
"share/deterministic-japanese-parser-mcp/dictionaries/system/rules" = ["dictionaries/system/rules/*.yaml"]
"share/deterministic-japanese-parser-mcp/dictionaries/system/synonyms.d" = ["dictionaries/system/synonyms.d/*.yaml"]
"share/deterministic-japanese-parser-mcp/dictionaries/system/task_templates.d" = ["dictionaries/system/task_templates.d/*.yaml"]
"share/deterministic-japanese-parser-mcp/dictionaries/system/language_features.d" = ["dictionaries/system/language_features.d/*.yaml"]
"share/deterministic-japanese-parser-mcp/dictionaries/system/compiled/language_features.d" = [
  "dictionaries/system/compiled/language_features.d/manifest.json",
  "dictionaries/system/compiled/language_features.d/*.b64",
]
"share/deterministic-japanese-parser-mcp/dictionaries/system/compiled/open_lexicon" = [
  "dictionaries/system/compiled/open_lexicon/manifest.json",
]
"share/deterministic-japanese-parser-mcp/dictionaries/system/compiled/open_lexicon/indexes" = [
  "dictionaries/system/compiled/open_lexicon/indexes/*.json.gz",
]
"share/deterministic-japanese-parser-mcp/dictionaries/system/compiled/open_lexicon/records" = [
  "dictionaries/system/compiled/open_lexicon/records/*.jsonl.gz",
]
"share/deterministic-japanese-parser-mcp/dictionaries/system/compiled/semantic_candidates" = [
  "dictionaries/system/compiled/semantic_candidates/*.json",
  "dictionaries/system/compiled/semantic_candidates/*.sqlite3",
]
"share/deterministic-japanese-parser-mcp/dictionaries/system/compiled/semantic_data" = [
  "dictionaries/system/compiled/semantic_data/*.json",
]
"share/deterministic-japanese-parser-mcp/dictionaries/system/compiled/semantic_data/indexes" = [
  "dictionaries/system/compiled/semantic_data/indexes/*.json.gz",
]
"share/deterministic-japanese-parser-mcp/dictionaries/system/compiled/semantic_data/records" = [
  "dictionaries/system/compiled/semantic_data/records/*.jsonl.gz",
]
"share/deterministic-japanese-parser-mcp/dictionaries/sources" = [
  "dictionaries/sources/*.json",
]
"share/deterministic-japanese-parser-mcp/dictionaries/user" = [
  "dictionaries/user/metaphor.json",
  "dictionaries/user/rules.yaml",
  "dictionaries/user/synonyms.yaml",
  "dictionaries/user/task_templates.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

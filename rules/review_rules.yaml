scope_rules:
  semantic:
    default_polarity: neutral
    default_intensity: 0.0
    explicit_polarity_intensity: 0.5
    insufficient_evidence_status: needs-evidence
    sufficient_evidence_status: approved
  pragmatic:
    open_lexicon_status: approved
    feature_match_status: approved
    feature_mismatch_status: approved
    insufficient_evidence_status: needs-evidence
    principle: Pragmatic review separates usable lexical context from whether the supplied feature bucket is actually evidenced.
  task:
    default_status: approved
    action_sensitive_status: needs-evidence
    task_candidates: []
    principle: A lexical item alone does not establish an executable task. Action-sensitive items require sentence/speech-act
      evidence before task promotion.
  external_action:
    status: approved
    risk_true_when_risk_class:
    - action
    principle: action-sensitive lexical/reference/modality evidence is guarded downstream
sample_review_findings:
  first_100_bias: The fixed queue is sorted by source_kind/record_id, so the first 100 are all dialect-labelled context records.
  escape_hatch_used: true
  category_samples: Representative records were also inspected for discourse, modality, honorific, slang, metaphor, onomatopoeia,
    reference, and open_lexicon before generalizing rules.
  feature_label_noise: Context feature labels are not assumed correct; clear lexical meaning can be preserved while unsupported
    language_feature targeting is removed.
  uncertainty_policy: Pending license, placeholder meaning, or unresolved ambiguity remains needs-evidence rather than being
    auto-approved.

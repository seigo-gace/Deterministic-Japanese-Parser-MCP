- id: WF-INCIDENT_RESPONSE
  intent: workflow
  name: incident_response
  steps: [{order: 1, action: 影響範囲確認}, {order: 2, action: 応急対応}, {order: 3, action: 安定確認}, {order: 4, action: 根本原因分析}, {order: 5, action: 恒久対策}, {order: 6, action: 回帰検証}]
